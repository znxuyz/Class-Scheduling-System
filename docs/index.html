<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="國小排課系統的畫面原型：配課鐘點檢查、科任先排、交接檢查、導師自排與三視角課表。">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:title" content="國小排課系統">
<meta property="og:description" content="國小排課系統的畫面原型：配課鐘點檢查、科任先排、交接檢查、導師自排與三視角課表。">
<meta property="og:url" content="https://znxuyz.github.io/Class-Scheduling-System/">
<title>國小排課系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
</head>
<body>
<style>
:root{
  --ground:#EDF1F0; --surface:#FFFFFF; --surface-2:#F5F8F7; --sunken:#E3E9E7;
  --ink:#101917; --ink-2:#4A5956; --ink-3:#778582; --line:#D3DCD9; --line-2:#C0CCC8;
  --accent:#0D6E66; --accent-soft:#DCEAE8; --accent-ink:#0A544E;
  --homeroom:#A8672F; --homeroom-bg:#F6EADF; --homeroom-line:#E0C3A4;
  --special:#16736C; --special-bg:#DDEDEB; --special-line:#A9CFCA;
  --admin:#55589E; --admin-bg:#E4E5F4; --admin-line:#B9BBDF;
  --ok:#3D7A44; --ok-bg:#E1EFE2; --warn:#A9761A; --warn-bg:#F7ECD8; --bad:#AB3B2C; --bad-bg:#F7E3E0;
  --shadow:0 1px 2px rgba(16,25,23,.06),0 4px 16px rgba(16,25,23,.05);
  --r:7px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0E1413; --surface:#171F1D; --surface-2:#1C2523; --sunken:#121A18;
  --ink:#E4EAE7; --ink-2:#A3B0AC; --ink-3:#75837F; --line:#2A3634; --line-2:#3A4744;
  --accent:#4FB5AA; --accent-soft:#16302D; --accent-ink:#7FCFC5;
  --homeroom:#D89A5F; --homeroom-bg:#2E2318; --homeroom-line:#54402A;
  --special:#4FB0A6; --special-bg:#152B29; --special-line:#2B4A46;
  --admin:#9093D6; --admin-bg:#1E2038; --admin-line:#383B63;
  --ok:#6FB575; --ok-bg:#17281A; --warn:#D8A445; --warn-bg:#2C2314; --bad:#E07D6C; --bad-bg:#2E1B18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#0E1413; --surface:#171F1D; --surface-2:#1C2523; --sunken:#121A18;
  --ink:#E4EAE7; --ink-2:#A3B0AC; --ink-3:#75837F; --line:#2A3634; --line-2:#3A4744;
  --accent:#4FB5AA; --accent-soft:#16302D; --accent-ink:#7FCFC5;
  --homeroom:#D89A5F; --homeroom-bg:#2E2318; --homeroom-line:#54402A;
  --special:#4FB0A6; --special-bg:#152B29; --special-line:#2B4A46;
  --admin:#9093D6; --admin-bg:#1E2038; --admin-line:#383B63;
  --ok:#6FB575; --ok-bg:#17281A; --warn:#D8A445; --warn-bg:#2C2314; --bad:#E07D6C; --bad-bg:#2E1B18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Noto Serif TC",Georgia,serif; text-wrap:balance; margin:0; font-weight:600}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:1240px; margin:0 auto; padding:0 24px}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--line); background:var(--surface)}
.head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:22px 0 18px; flex-wrap:wrap}
h1{font-size:22px; letter-spacing:.01em}
.sub{color:var(--ink-2); font-size:13px; margin-top:3px}
.stats{display:flex; gap:22px; flex-wrap:wrap}
@media(max-width:560px){.stat{text-align:left} .head{gap:14px}}
.stat{text-align:right}
.stat b{display:block; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:19px; font-weight:600; line-height:1.2; color:var(--ink)}
.stat span{font-size:11px; color:var(--ink-3); letter-spacing:.08em}

/* ---------- step nav ---------- */
nav{background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
.steps{display:flex; gap:0; overflow-x:auto; scrollbar-width:thin}
.step{
  appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  padding:11px 17px 10px; display:flex; align-items:center; gap:9px; cursor:pointer;
  color:var(--ink-3); font-family:inherit; font-size:13.5px; white-space:nowrap; transition:color .15s;
}
.step:hover{color:var(--ink-2)}
.step .n{
  font-family:"IBM Plex Mono",monospace; font-size:11px; width:19px; height:19px; flex:none;
  border:1px solid var(--line-2); border-radius:50%; display:grid; place-items:center; color:var(--ink-3);
}
.step[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:500}
.step[aria-selected="true"] .n{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .step[aria-selected="true"] .n{color:#0E1413}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .step[aria-selected="true"] .n{color:#0E1413}}
.step:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

/* ---------- layout ---------- */
main{padding:26px 0 64px}
.panel[hidden]{display:none}
.lede{max-width:64ch; color:var(--ink-2); margin:0 0 20px; font-size:14px}
.lede strong{color:var(--ink); font-weight:500}
.cols{display:grid; grid-template-columns:265px 1fr; gap:22px; align-items:start}
/* 沒有這行，內層課表的 overflow-x 關不住，整頁會跟著橫向捲動 */
.cols>*{min-width:0}
.card,.card-b{min-width:0}
.cols.wide{grid-template-columns:300px 1fr}
@media(max-width:900px){.cols,.cols.wide{grid-template-columns:1fr}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card-h{padding:12px 15px; border-bottom:1px solid var(--line); display:flex;
  align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.card-h h3{font-size:14px}
.card-b{padding:15px}
.eyebrow{font-size:10.5px; letter-spacing:.12em; color:var(--ink-3); text-transform:uppercase; font-weight:500}

/* ---------- timetable grid ---------- */
.tt-scroll{overflow-x:auto}
.tt{display:grid; grid-template-columns:52px repeat(5,minmax(112px,1fr));
  grid-auto-rows:minmax(50px,auto); gap:3px; min-width:660px}
.tt-hd{font-size:11.5px; color:var(--ink-3); text-align:center; padding:5px 0; letter-spacing:.06em}
.tt-p{
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3);
  display:flex; align-items:center; justify-content:center; border-right:1px solid var(--line);
}
.cell{
  min-height:50px; border-radius:5px; border:1px solid var(--line); background:var(--surface-2);
  padding:5px 7px; display:flex; flex-direction:column; justify-content:center; gap:1px;
  font-size:12.5px; position:relative; transition:background .12s,border-color .12s;
}
.cell .t1{font-weight:500; line-height:1.3}
.cell .t2{font-size:10.5px; color:var(--ink-3); line-height:1.3}
.cell.blocked{background:transparent; border-style:dashed; border-color:var(--line);
  background-image:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--sunken) 5px,var(--sunken) 10px)}
.cell.free{background:var(--sunken); border-color:transparent}
.cell.r-homeroom{background:var(--homeroom-bg); border-color:var(--homeroom-line)}
.cell.r-homeroom .t1{color:var(--homeroom)}
.cell.r-special{background:var(--special-bg); border-color:var(--special-line)}
.cell.r-special .t1{color:var(--special)}
.cell.r-admin{background:var(--admin-bg); border-color:var(--admin-line)}
.cell.r-admin .t1{color:var(--admin)}
.cell.dbl::after{content:"連堂"; position:absolute; top:3px; right:4px; font-size:9px;
  letter-spacing:.05em; color:var(--ink-3); opacity:.8}
.cell.locked{opacity:.62}
.cell.movable{cursor:grab}
.cell.movable:hover{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.cell.sel{box-shadow:0 0 0 2px var(--accent); border-color:var(--accent)}
.cell.tgt-ok{background:var(--ok-bg); border:1px dashed var(--ok); cursor:pointer}
.cell.tgt-ok:hover{box-shadow:0 0 0 2px var(--ok)}
.cell.tgt-no{background:var(--bad-bg); border:1px dashed var(--bad); cursor:not-allowed}
.cell:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ---------- misc ---------- */
.chip{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:2px 8px;
  border-radius:99px; border:1px solid var(--line-2); color:var(--ink-2); background:var(--surface-2)}
.chip.homeroom{color:var(--homeroom); background:var(--homeroom-bg); border-color:var(--homeroom-line)}
.chip.special{color:var(--special); background:var(--special-bg); border-color:var(--special-line)}
.chip.admin{color:var(--admin); background:var(--admin-bg); border-color:var(--admin-line)}
.chip.ok{color:var(--ok); background:var(--ok-bg); border-color:var(--ok)}
.chip.warn{color:var(--warn); background:var(--warn-bg); border-color:var(--warn)}
.chip.bad{color:var(--bad); background:var(--bad-bg); border-color:var(--bad)}
.tbl{overflow-x:auto; padding:4px 6px}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:520px}
th{text-align:left; font-weight:500; font-size:10.5px; letter-spacing:.09em; color:var(--ink-3);
  text-transform:uppercase; padding:7px 9px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:7px 9px; border-bottom:1px solid var(--line); vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right}
.bar{height:5px; border-radius:3px; background:var(--sunken); overflow:hidden; min-width:56px}
.bar i{display:block; height:100%; border-radius:3px; background:var(--accent)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
select,button.btn{font-family:inherit; font-size:13px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line-2); border-radius:5px; padding:5px 9px; cursor:pointer}
select:focus-visible,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
button.btn:hover{border-color:var(--accent); color:var(--accent)}
button.btn.on{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] button.btn.on{color:#0E1413}
.seg{display:inline-flex; border:1px solid var(--line-2); border-radius:5px; overflow:hidden}
.seg button{appearance:none; border:0; background:var(--surface); color:var(--ink-2);
  font-family:inherit; font-size:12.5px; padding:5px 12px; cursor:pointer; border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0E1413}
.note{padding:10px 13px; border-radius:6px; font-size:12.5px; border-left:3px solid; line-height:1.55}
.note.ok{background:var(--ok-bg); border-color:var(--ok)}
.note.warn{background:var(--warn-bg); border-color:var(--warn)}
.note.bad{background:var(--bad-bg); border-color:var(--bad)}
.note.info{background:var(--accent-soft); border-color:var(--accent)}
.vlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.vlist li{font-size:12.5px; color:var(--ink-2); display:flex; gap:8px; align-items:baseline}
.legend{display:flex; gap:13px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3); align-items:center}
.sw{width:11px; height:11px; border-radius:3px; display:inline-block; vertical-align:-1px; margin-right:4px; border:1px solid}
.kv{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:12.5px; border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-3)} .kv b{font-weight:500; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.dayrow{display:flex; gap:3px; align-items:center}
.daybox{width:22px; height:22px; border-radius:4px; display:grid; place-items:center;
  font-family:"IBM Plex Mono",monospace; font-size:11px; border:1px solid var(--line-2); background:var(--surface-2)}
.daybox.over{background:var(--bad-bg); border-color:var(--bad); color:var(--bad); font-weight:600}
.daybox.zero{color:var(--ink-3); opacity:.5}

/* ---------- 資料輸入 ---------- */
.t-row{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  padding:9px 14px; background:none; border:0; border-bottom:1px solid var(--line);
  border-left:2px solid transparent; cursor:pointer; font-family:inherit;
  font-size:13px; color:var(--ink);
}
.t-row:hover{background:var(--surface-2)}
.t-row.on{background:var(--accent-soft); border-left-color:var(--accent)}
.t-row:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.t-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.t-num{font-size:11.5px; color:var(--ink-3)}
.t-num.over{color:var(--bad); font-weight:600}
.t-flag{color:var(--bad); font-weight:700; flex:none}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px}
.fld{display:flex; flex-direction:column; gap:5px; min-width:0}
.fld .eyebrow{margin-bottom:1px}
.hint{font-size:11.5px; color:var(--ink-3); line-height:1.5}
.in{
  font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line-2); border-radius:5px; padding:6px 9px; width:100%;
}
.in:focus-visible{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.in.w{width:72px; font-family:"IBM Plex Mono",monospace; text-align:right; flex:none}
.chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px}
.chip-tog{
  appearance:none; font-family:inherit; font-size:12px; padding:3px 10px; cursor:pointer;
  border-radius:99px; border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-2);
}
.chip-tog:hover{border-color:var(--accent); color:var(--accent)}
.chip-tog.on{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .chip-tog.on{color:#0E1413}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip-tog.on{color:#0E1413}}
.chip-tog:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.c-row{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  padding:9px 12px; border:1px solid var(--line); border-radius:6px; background:var(--surface-2);
}
.c-txt{flex:1; min-width:170px; font-size:13px}
.btn.x{padding:4px 9px; color:var(--ink-3); flex:none}
.btn.x:hover{border-color:var(--bad); color:var(--bad)}
.add-c{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:12px;
  padding:12px; border:1px dashed var(--line-2); border-radius:6px;
}
.p-row{display:flex; align-items:center; gap:9px; flex-wrap:wrap}
.pick{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.pick-l{font-size:11.5px; color:var(--ink-3)}

/* ---------- 線上排課 ---------- */
.head-right{display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.btn.solve{
  background:var(--accent); border-color:var(--accent); color:#fff;
  font-size:13.5px; padding:7px 15px; font-weight:500;
}
:root[data-theme="dark"] .btn.solve{color:#0E1413}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.solve{color:#0E1413}}
.btn.solve:hover{filter:brightness(1.08); color:#fff; border-color:var(--accent)}
:root[data-theme="dark"] .btn.solve:hover{color:#0E1413}
.btn.solve:disabled{opacity:.55; cursor:default; filter:none}
#solve-bar{padding:10px 0 2px}
.sb-row{display:flex; align-items:center; gap:13px; flex-wrap:wrap}
.sb-phase{font-size:12.5px; color:var(--ink-2); min-width:160px}
.sb-track{flex:1; min-width:130px; height:5px; background:var(--sunken); border-radius:3px; overflow:hidden}
.sb-track i{display:block; height:100%; width:0; background:var(--accent); border-radius:3px}
.sb-cost{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* ---------- 配課矩陣 ---------- */
table.mx{min-width:760px}
table.mx th.mx-h{text-align:center; padding:7px 4px; font-size:10px; letter-spacing:.02em}
td.mx-c{
  text-align:center; padding:4px 5px; cursor:pointer; border:1px solid transparent;
  border-bottom:1px solid var(--line); min-width:52px; line-height:1.25;
}
td.mx-c:hover{border-color:var(--accent)}
td.mx-c.on{box-shadow:inset 0 0 0 2px var(--accent)}
td.mx-c:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
td.mx-c.empty{color:var(--ink-3); opacity:.45; font-size:13px}
td.mx-c.empty:hover{opacity:1}
td.mx-c b{font-size:13px; display:block}
td.mx-c .mx-t{font-size:9.5px; color:var(--ink-3); display:block; white-space:nowrap}
td.mx-c i.dbl{font-style:normal; font-size:8.5px; color:var(--ink-3);
  border:1px solid var(--line-2); border-radius:3px; padding:0 2px; vertical-align:1px}
td.mx-c.r-homeroom{background:var(--homeroom-bg)} td.mx-c.r-homeroom b{color:var(--homeroom)}
td.mx-c.r-special{background:var(--special-bg)}   td.mx-c.r-special b{color:var(--special)}
td.mx-c.r-admin{background:var(--admin-bg)}       td.mx-c.r-admin b{color:var(--admin)}
td.num.over{color:var(--bad); font-weight:600}


/* 已被佔用、但可以放上去的格子（放上去＝對調或連動） */
.cell.rt-ok{box-shadow:inset 0 0 0 2px var(--ok)}
.cell.rt-ripple{box-shadow:inset 0 0 0 2px var(--warn)}
.cell.rt-no{opacity:.4}
/* ---------- 連動調整 ---------- */
.cell.tgt-rip{background:var(--warn-bg); border:1px dashed var(--warn); cursor:pointer}
.cell.tgt-rip:hover{box-shadow:0 0 0 2px var(--warn)}
.mv-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px 12px; border:1px solid var(--line); border-radius:6px; background:var(--surface-2); font-size:13px}
.mv-row.primary{border-color:var(--accent); background:var(--accent-soft)}
.mv-who{flex:1; min-width:130px}
.mv-slot{font-size:12px; color:var(--ink-2)}
.mv-slot.to{color:var(--accent); font-weight:600}
.mv-arrow{color:var(--ink-3)}
.mv-room{font-size:11px; color:var(--ink-3); border:1px solid var(--line-2); border-radius:4px; padding:1px 6px}

/* ---------- 時段勾選格 ---------- */
.sp{display:grid; gap:3px; min-width:340px}
.sp-h{font-size:11px; color:var(--ink-3); text-align:center; padding:3px 0}
.sp-p{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-3);
  display:flex; align-items:center; justify-content:center}
.sp-c{
  appearance:none; height:30px; border:1px solid var(--line-2); border-radius:4px;
  background:var(--surface-2); color:var(--ink-3); font-family:inherit; font-size:11px; cursor:pointer;
}
.sp-c:hover{border-color:var(--accent)}
.sp-c.on{background:var(--sunken); color:var(--ink-2); border-style:dashed;
  background-image:repeating-linear-gradient(45deg,transparent,transparent 4px,var(--line) 4px,var(--line) 8px)}
.sp-c:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ---------- 列印 ---------- */
#print-area{display:none}
@media print{
  body>*{display:none!important}
  #print-area{display:block!important}

<script>
const D_SEED = JSON.parse(document.getElementById('data').textContent);
const STORE = 'scheduling.school.v2';

// 整份學校資料存成一份。先前只存老師，其他設定一重新整理就沒了。
function loadAll(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw){
      const j = JSON.parse(raw);
      if(j && j.grid && j.classes && j.placements) return j;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(D_SEED));
}
let saveTimer = null;
function saveAll(){
  // 編輯時會連續觸發，合併成一次寫入
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    saveTimer = null;
    try{ localStorage.setItem(STORE, JSON.stringify(D)); }
    catch(e){ console.warn('存不進瀏覽器儲存空間', e); }
  }, 250);
}
function resetAll(){
  try{ localStorage.removeItem(STORE); }catch(e){}
  location.reload();
}
const D = loadAll();
const G = D.grid, DAYS = ['一','二','三','四','五'];
const slotOf = (d,p)=>(d-1)*G.periods+(p-1);
const dayOf = s=>Math.floor(s/G.periods)+1, perOf = s=>s%G.periods+1;
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const roleOf = tid => D.teachers[tid].role;
const ROLE_TXT = {homeroom:'導師', special:'科任', admin:'行政'};

/* ============ 課表格線 ============ */
function grid(opts){
  const {occupied, blocked=[], cellFn, onCell} = opts;
  const wrap = el('div','tt-scroll'), g = el('div','tt');
  // 每一格都顯式定位。連堂會佔兩列，若交給 grid 自動排版，後面的格子會被整批
  // 往後推擠，節次標籤與星期欄就對不上了。
  const hd0 = el('div','tt-hd',''); hd0.style.gridArea = '1 / 1'; g.appendChild(hd0);
  DAYS.forEach((d,i)=>{ const e = el('div','tt-hd','週'+d);
    e.style.gridArea = `1 / ${i+2}`; g.appendChild(e); });

  // 連堂的第二節：不另外佔格，由第一節向下延伸蓋住
  const spanned = new Set();
  Object.entries(occupied).forEach(([s,it])=>{
    if(!it || it.len !== 2) return;
    spanned.add((it.slot != null ? it.slot : +s) + 1);
  });

  for(let p=1;p<=G.periods;p++){
    const lab = el('div','tt-p','第'+p+'節'); lab.style.gridArea = `${p+1} / 1`; g.appendChild(lab);
    for(let d=1;d<=G.days;d++){
      const s = slotOf(d,p);
      if(spanned.has(s)) continue;
      const c = cellFn(s, occupied[s], blocked.includes(s));
      c.dataset.slot = s;
      const rows = (occupied[s] && occupied[s].len === 2) ? 2 : 1;
      c.style.gridArea = `${p+1} / ${d+1} / span ${rows} / span 1`;
      if(onCell) { c.tabIndex = 0; c.addEventListener('click',()=>onCell(s,occupied[s]));
        c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onCell(s,occupied[s]);}}); }
      g.appendChild(c);
    }
  }
  wrap.appendChild(g); return wrap;
}
function lessonCell(pl, {locked=false, movable=false, sub2='class'}={}){
  const role = roleOf(pl.t);
  const c = el('div','cell r-'+role+(pl.len===2?' dbl':'')+(locked?' locked':'')+(movable?' movable':''));
  c.appendChild(el('div','t1', D.subjects[pl.s].name));
  const second = sub2==='class' ? D.classes[pl.c].name : (sub2==='teacher' ? D.teachers[pl.t].name : D.rooms[pl.r].name);
  c.appendChild(el('div','t2', second));
  return c;
}
function emptyCell(blocked){ return el('div','cell '+(blocked?'blocked':'free')); }

/* ============ 步驟 1 配課 ============ */
function renderLoad(){
  const p = document.getElementById('p-load'); p.innerHTML='';
  p.appendChild(el('p','lede','排課之前先確認<strong>每位老師要上哪些課、鐘點會不會太多</strong>。'
    +'這一步就能擋掉大部分注定排不出來的配課 —— 而且問題指向的是具體某個人，不是一句「無解」。'));

  const cols = el('div','cols');
  const side = el('div','card');
  side.appendChild(el('div','card-h','<h3>可行性檢查</h3>'));
  const sb = el('div','card-b');
  sb.appendChild(el('div','note '+(D.feasibility.length?'bad':'ok'),
    D.feasibility.length ? '✗ '+D.feasibility.join('<br>✗ ')
    : '<b>全部通過</b><br>班級容量、教師鐘點、教師日上限總量、專科教室容量，皆在可排範圍內。'));
  const counts = {homeroom:0,special:0,admin:0};
  TROWS().forEach(l=>counts[l.role]++);
  const box = el('div'); box.style.marginTop='13px';
  box.innerHTML = `<div class="eyebrow" style="margin-bottom:7px">教師編制</div>
    <div class="kv"><span>導師（包班）</span><b>${counts.homeroom}</b></div>
    <div class="kv"><span>科任（跑班）</span><b>${counts.special}</b></div>
    <div class="kv"><span>兼行政（減課）</span><b>${counts.admin}</b></div>`;
  sb.appendChild(box);
  sb.appendChild(el('div','note info','檢查項目是<b>必要條件</b>：通過不保證排得出來，沒通過則一定排不出來。成本只是純計數，可以邊配課邊即時跑。'));
  sb.lastChild.style.marginTop='13px';
  side.appendChild(sb); cols.appendChild(side);

  const main = el('div','card');
  const h = el('div','card-h','<h3>教師配課與鐘點</h3>');
  const seg = el('div','seg');
  ['全部','導師','科任','行政'].forEach((t,i)=>{
    const b = el('button',null,t); b.setAttribute('aria-pressed', i===0);
    b.onclick=()=>{ [...seg.children].forEach(x=>x.setAttribute('aria-pressed',false));
      b.setAttribute('aria-pressed',true); fill(['all','homeroom','special','admin'][i]); };
    seg.appendChild(b);
  });
  h.appendChild(seg); main.appendChild(h);
  const body = el('div','tbl'); main.appendChild(body);
  function fill(filter){
    body.innerHTML='';
    const t = el('table');
    t.innerHTML = '<thead><tr><th>教師</th><th>身分</th><th>任教</th><th>班級數</th>'
      + '<th style="text-align:right">週節數</th><th style="width:120px">佔週上限</th><th>日上限</th></tr></thead>';
    const tb = el('tbody');
    TROWS().filter(l=>filter==='all'||l.role===filter)
      .sort((a,b)=>b.total-a.total).forEach(l=>{
      const pct = Math.min(100, l.total/l.max*100);
      const cls = pct>100?'bad':(pct>90?'warn':'');
      const tr = el('tr');
      tr.innerHTML = `<td>${l.name}</td>
        <td><span class="chip ${l.role}">${ROLE_TXT[l.role]}</span></td>
        <td style="font-size:12px;color:var(--ink-2)">${l.subjects.map(s=>D.subjects[s].name).join('、')}</td>
        <td class="num">${l.classes.length}</td>
        <td class="num">${l.total} / ${l.max}</td>
        <td><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div></td>
        <td class="num">${l.cap>=G.periods?'—':l.cap+' 節'}</td>`;
      tb.appendChild(tr);
    });
    t.appendChild(tb); body.appendChild(t);
  }
  fill('all'); cols.appendChild(main); p.appendChild(cols);
}
</script>
<script>
/* ============ 步驟 2 科任／行政排課 ============ */
let p1Mode = 'teacher', p1Key = null;
function renderPhase1(){
  const p = document.getElementById('p-phase1'); p.innerHTML='';
  p.appendChild(el('p','lede','科任與兼行政教師<strong>跨班跑、共用專科教室、有固定行政時段</strong>，'
    +'是全校最稀缺的資源。三大衝堂幾乎都發生在這一層，所以他們必須全校一起求解、而且先排。'));

  const p1 = D.placements.filter(x=>x.ph===1);
  const cols = el('div','cols');

  const side = el('div','card');
  side.appendChild(el('div','card-h','<h3>求解結果</h3>'));
  const sb = el('div','card-b');
  sb.innerHTML = `<div class="kv"><span>狀態</span><b>${D.solve.p1.status}</b></div>
    <div class="kv"><span>耗時</span><b>${D.solve.p1.time}s</b></div>
    <div class="kv"><span>已排單元</span><b>${p1.length}</b></div>
    <div class="kv"><span>懲罰成本</span><b>${D.solve.p1.penalty}</b></div>`;
  const v = el('div'); v.style.marginTop='14px';
  v.appendChild(el('div','eyebrow','未完全滿足的軟性需求'));
  const ul = el('ul','vlist'); ul.style.marginTop='7px';
  D.solve.p1.violations.forEach(x=>{ const li=el('li'); li.innerHTML='<span style="color:var(--warn)">!</span><span>'+x+'</span>'; ul.appendChild(li); });
  v.appendChild(ul); sb.appendChild(v);
  sb.appendChild(el('div','note info','軟性需求打架時，系統給的是<b>違反最少</b>的課表，並明講犧牲了什麼 —— 而不是丟一句「無解」讓教務主任自己猜。'));
  sb.lastChild.style.marginTop='14px';
  side.appendChild(sb); cols.appendChild(side);

  const main = el('div','card');
  const h = el('div','card-h','<h3>排課結果</h3>');
  const ctl = el('div'); ctl.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap';
  const seg = el('div','seg');
  [['teacher','依教師'],['room','依專科教室']].forEach(([m,t])=>{
    const b=el('button',null,t); b.setAttribute('aria-pressed', m===p1Mode);
    b.onclick=()=>{ p1Mode=m; p1Key=null; renderPhase1(); }; seg.appendChild(b);
  });
  const sel = el('select');
  const opts = p1Mode==='teacher'
    ? TROWS().filter(l=>l.role!=='homeroom').map(l=>[l.id,l.name+'（'+ROLE_TXT[l.role]+'）'])
    : Object.entries(D.rooms).filter(([,r])=>r.type!=='homeroom').map(([id,r])=>[id,r.name]);
  if(!p1Key) p1Key = opts[0][0];
  opts.forEach(([id,name])=>{ const o=el('option',null,name); o.value=id; if(id===p1Key)o.selected=true; sel.appendChild(o); });
  sel.onchange = ()=>{ p1Key = sel.value; renderPhase1(); };
  ctl.appendChild(seg); ctl.appendChild(sel); h.appendChild(ctl); main.appendChild(h);

  const b = el('div','card-b');
  const mine = p1.filter(x => p1Mode==='teacher' ? x.t===p1Key : x.r===p1Key);
  const occ = {}; mine.forEach(x=>occ[x.slot]=x);
  const blocked = p1Mode==='teacher' ? teacherHardBlocked(p1Key) : [];
  b.appendChild(grid({occupied:occ, blocked, cellFn:(s,it,bl)=>
    it ? lessonCell(it,{sub2:'class'}) : emptyCell(bl)}));
  const foot = el('div'); foot.style.cssText='margin-top:12px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap';
  foot.appendChild(el('div','legend','<span>'+mine.length+' 個時段</span>'
    + (blocked.length?'<span><span class="sw" style="background:var(--sunken);border-color:var(--line)"></span>不可排課（硬性）</span>':'')));
  b.appendChild(foot); main.appendChild(b); cols.appendChild(main); p.appendChild(cols);
}
function teacherHardBlocked(tid){
  const out=[];
  D.constraints.forEach(c=>{
    if(!c.hard || c.params.teacher!==tid) return;
    if(c.kind==='TEACHER_UNAVAILABLE'){
      const ds=c.params.days||[...Array(G.days)].map((_,i)=>i+1);
      const ps=c.params.periods||[...Array(G.periods)].map((_,i)=>i+1);
      ds.forEach(d=>ps.forEach(p=>out.push(slotOf(d,p))));
    }
    if(c.kind==='TEACHER_DAY_OFF') for(let p=1;p<=G.periods;p++) out.push(slotOf(c.params.day,p));
    if(c.kind==='TEACHER_ONLY_IN'){
      const ds=c.params.days||[...Array(G.days)].map((_,i)=>i+1);
      const ps=c.params.periods||[...Array(G.periods)].map((_,i)=>i+1);
      const ok=new Set(); ds.forEach(d=>ps.forEach(p=>ok.add(slotOf(d,p))));
      for(let s=0;s<G.days*G.periods;s++) if(!ok.has(s)) out.push(s);
    }
  });
  return out;
}

/* ============ 步驟 3 交接檢查 ============ */
let hoMode = 'good';
function renderHandoff(){

    +'必須在把課表交給導師之前就檢查出來。'));

  const bar = el('div'); bar.style.cssText='display:flex;gap:9px;align-items:center;margin-bottom:16px;flex-wrap:wrap';

  [['bad','科任排課時不管導師'],['good','科任排課時為導師保留空格']].forEach(([m,t])=>{
    const b=el('button',null,t); b.setAttribute('aria-pressed', m===hoMode);
    b.onclick=()=>{ hoMode=m; renderHandoff(); }; seg.appendChild(b);
  });
  bar.appendChild(el('span','eyebrow','對照')); bar.appendChild(seg); p.appendChild(bar);

  const H = D.handoff[hoMode], failed = hoMode==='bad' ? D.solve.badFailed : [];

    const n = el('div','note warn');
    n.innerHTML = '這份對照是<b>原始資料</b>算出來的。重新排課後沒有再跑一次「不管導師」的版本，'
      + '所以下面看到的是目前這份課表的數字，不是對照組。';
    n.style.marginBottom='14px'; p.appendChild(n);
  }
  const nOver = Object.values(H).filter(h=>h.over.some(Boolean)).length;
  const nTight = Object.values(H).filter(h=>h.usable===h.need).length;

  p.appendChild(el('div','note '+(failed.length?'bad':'ok'),
    failed.length
      ? `<b>${failed.map(c=>D.classes[c].name).join('、')} 的導師排不出課表（INFEASIBLE）。</b><br>`
        + `空格總數看起來夠，但有幾天留下的空格多於導師的日上限，那些格子永遠用不掉；`
        + `扣掉之後實際可用節數與需求相等甚至更少，再加上連堂必須佔兩個相鄰格，就沒有解了。`
      : `<b>十二個班的導師都排得出來。</b><br>每個班每天留給導師的空格都沒有超過導師的日上限，`
        + `而且想休假的導師，該班那天已由科任課填滿。`));

  const cols2 = el('div'); cols2.style.cssText='display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px';
  const card = el('div','card');
  const ch = el('div','card-h','<h3>各班留給導師的空格</h3>');

    `<span><span class="sw" style="background:var(--surface-2);border-color:var(--line-2)"></span>正常</span>`

    + '<th style="text-align:right">導師需求</th><th style="text-align:right">實際可用</th><th>結果</th></tr></thead>';
  const tb = el('tbody');
  Object.entries(H).forEach(([cid,h])=>{
    const tr = el('tr');
    const boxes = h.per_day.map((n,i)=>`<span class="daybox${h.over[i]?' over':(n===0?' zero':'')}" title="週${DAYS[i]}">${n}</span>`).join('');

      : (h.usable===h.need ? '<span class="chip warn">零餘裕</span>' : '<span class="chip ok">可排</span>');
    tr.innerHTML = `<td>${D.classes[cid].name}</td>
      <td><div class="dayrow">${boxes}</div></td>
      <td class="num">${h.free}</td><td class="num">${h.need}</td>
      <td class="num"${h.usable<h.need?' style="color:var(--bad);font-weight:600"':''}>${h.usable}</td>
      <td>${status}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); cb.appendChild(t); card.appendChild(cb);
  const cf = el('div','card-b'); cf.style.borderTop='1px solid var(--line)';
  cf.innerHTML = `<div class="eyebrow" style="margin-bottom:6px">實際可用怎麼算</div>
    <div style="font-size:12.5px;color:var(--ink-2);max-width:70ch">
    導師一天最多上 <b>N</b> 節，所以某天就算留了 7 格，也只有 N 格用得到。
    <span class="mono">實際可用 = Σ min(當日空格, 導師日上限)</span>。
    這個數字小於導師需求，就是排不出來 —— 而且在科任排完的當下就算得出來，
    不必等導師試排失敗才發現。</div>`;
  card.appendChild(cf); cols2.appendChild(card); p.appendChild(cols2);

  const sum = el('div'); sum.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:16px';
  [['有天數超過導師日上限的班級', nOver, nOver?'bad':'ok'],
   ['零餘裕（可用＝需求）的班級', nTight, nTight?'warn':'ok'],
   ['導師排不出課表的班級', failed.length, failed.length?'bad':'ok']].forEach(([lab,n,tone])=>{
    const c = el('div','card'); const b=el('div','card-b');
    b.innerHTML = `<div class="eyebrow">${lab}</div>
      <div class="mono" style="font-size:27px;font-weight:600;margin-top:5px;color:var(--${tone})">${n}<span style="font-size:14px;color:var(--ink-3)"> / 12</span></div>`;
    c.appendChild(b); sum.appendChild(c);
  });
  p.appendChild(sum);
}
</script>
<script>
/* ============ 步驟 4 導師自排（可拖動，即時檢核） ============ */
// 導師的課直接改 D.placements 裡的那一筆，不另外存一份 —— 兩份真相會讓
// 「課表檢視」與「連動調整」讀到過期的位置。
function hrLessons(cid){ return D.placements.filter(p=>p.ph===2 && p.c===cid); }
let P2_ORIG = {};
function snapshotP2(){
  P2_ORIG = {};
  Object.keys(D.classes).forEach(cid=>{
    P2_ORIG[cid] = hrLessons(cid).map(p=>({slot:p.slot, r:p.r}));
  });
}
snapshotP2();
let p2Class = Object.keys(D.classes)[0], p2Sel = null;

const canStartDouble = s => perOf(s) < G.periods && !G.breaks.includes(perOf(s));
function classOccupancy(cid, exceptIdx){
  const occ = {};
  D.placements.filter(x=>x.ph===1 && x.c===cid).forEach(x=>{
    for(let i=0;i<x.len;i++) occ[x.slot+i] = {...x, locked:true};
  });
  hrLessons(cid).forEach((x,i)=>{ if(i===exceptIdx) return;
    for(let k=0;k<x.len;k++) occ[x.slot+k] = {...x, idx:i}; });
  return occ;
}
/* 一次移動合不合法，以及為什麼不合法 —— 前端就能判斷，不必呼叫後端 */
function checkMove(cid, idx, target){
  const list = hrLessons(cid), lesson = list[idx], cls = D.classes[cid];
  const cap = D.teachers[lesson.t].cap;
  const need = [...Array(lesson.len)].map((_,i)=>target+i);
  if(lesson.len===2 && !canStartDouble(target)) return {ok:false, why:'連堂不能跨午休或跨日'};
  if(need.some(s=>dayOf(s)!==dayOf(target))) return {ok:false, why:'連堂不能跨日'};
  if(need.some(s=>cls.blocked.includes(s))) return {ok:false, why:'該班這節不上課'};
  const occ = classOccupancy(cid, idx);
  for(const s of need){
    const o = occ[s];
    if(o) return {ok:false, why: o.locked ? '已排定科任課：'+D.subjects[o.s].name : '已有導師課：'+D.subjects[o.s].name};
  }
  const d = dayOf(target);
  let dayCount = lesson.len;
  list.forEach((x,i)=>{ if(i===idx) return;
    for(let k=0;k<x.len;k++) if(dayOf(x.slot+k)===d) dayCount++; });
  if(dayCount > cap) return {ok:false, why:`超過導師日上限（該日將達 ${dayCount} 節，上限 ${cap} 節）`};
  return {ok:true};
}
function renderPhase2(){
  const p = document.getElementById('p-phase2'); p.innerHTML='';
  p.appendChild(el('p','lede','導師<strong>只教自己班、只用原班教室</strong>，所以扣掉科任課之後，班與班之間完全獨立 —— '
    +'導師怎麼排都不會影響別班。這就是「剩下來的給導師自己排」成立的原因，系統只需要即時檢核。'
    +'<br>點一堂<span style="color:var(--homeroom)">導師的課</span>，可以放的位置會亮起來。'));

  const cols = el('div','cols');
  const side = el('div','card');
  side.appendChild(el('div','card-h','<h3>即時檢核</h3>'));
  const sb = el('div','card-b'); sb.id='p2-check';
  side.appendChild(sb); cols.appendChild(side);

  const main = el('div','card');
  const h = el('div','card-h','<h3>導師課表</h3>');
  const ctl = el('div'); ctl.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap';
  const sel = el('select');
  Object.entries(D.classes).forEach(([id,c])=>{ const o=el('option',null,c.name); o.value=id;
    if(id===p2Class)o.selected=true; sel.appendChild(o); });
  sel.onchange=()=>{ p2Class=sel.value; p2Sel=null; renderPhase2(); };
  const reset = el('button','btn','復原');
  reset.onclick=()=>{
    hrLessons(p2Class).forEach((p,i)=>{ const o=(P2_ORIG[p2Class]||[])[i];
      if(o){ p.slot=o.slot; p.r=o.r; } });
    p2Sel=null; renderPhase2();
  };
  ctl.appendChild(sel); ctl.appendChild(reset); h.appendChild(ctl); main.appendChild(h);

  const b = el('div','card-b');
  const cls = D.classes[p2Class];
  const occ = classOccupancy(p2Class);
  const moves = p2Sel==null ? null : {};
  if(p2Sel!=null) for(let s=0;s<G.days*G.periods;s++) moves[s] = checkMove(p2Class, p2Sel, s);

  b.appendChild(grid({
    occupied: occ, blocked: cls.blocked,
    cellFn:(s,it,bl)=>{
      if(it){
        const c = lessonCell(it, {locked:!!it.locked, movable:it.idx!=null, sub2:'teacher'});
        if(it.idx!=null && it.idx===p2Sel) c.classList.add('sel');
        return c;
      }
      const c = emptyCell(bl);
      if(moves && !bl){
        const m = moves[s];
        c.classList.add(m.ok ? 'tgt-ok' : 'tgt-no');
        if(!m.ok) c.title = m.why;
        else c.appendChild(el('div','t2','放這裡'));
      }
      return c;
    },
    onCell:(s,it)=>{
      if(it && it.idx!=null){ p2Sel = (p2Sel===it.idx ? null : it.idx); renderPhase2(); return; }
      if(p2Sel!=null && !it){
        const m = checkMove(p2Class, p2Sel, s);
        if(m.ok){ hrLessons(p2Class)[p2Sel].slot = s; saveAll(); p2Sel=null; renderPhase2(); }
        else { flash(m.why); }
      }
    }
  }));
  const lg = el('div','legend'); lg.style.marginTop='12px';
  lg.innerHTML = `<span><span class="sw" style="background:var(--homeroom-bg);border-color:var(--homeroom-line)"></span>導師（可移動）</span>
    <span><span class="sw" style="background:var(--special-bg);border-color:var(--special-line)"></span>科任（已排定）</span>
    <span><span class="sw" style="background:var(--admin-bg);border-color:var(--admin-line)"></span>行政（已排定）</span>
    <span><span class="sw" style="background:var(--sunken);border-color:var(--line)"></span>空堂</span>`;
  b.appendChild(lg);
  const msg = el('div'); msg.id='p2-msg'; msg.style.marginTop='10px'; b.appendChild(msg);
  main.appendChild(b); cols.appendChild(main); p.appendChild(cols);
  renderP2Check();
}
function flash(why){
  const m = document.getElementById('p2-msg'); if(!m) return;
  m.innerHTML=''; m.appendChild(el('div','note bad','不能放這裡：'+why));
  setTimeout(()=>{ if(m) m.innerHTML=''; }, 3200);
}
function renderP2Check(){
  const sb = document.getElementById('p2-check'); if(!sb) return;
  const cid = p2Class, cls = D.classes[cid], list = hrLessons(cid);
  const tid = list[0].t, cap = D.teachers[tid].cap;
  const perDay = [...Array(G.days)].map((_,i)=>0);
  const bySubDay = {};
  list.forEach(x=>{ for(let k=0;k<x.len;k++){ const s=x.slot+k, d=dayOf(s);
    perDay[d-1]++; const key=x.s+'|'+d; bySubDay[key]=(bySubDay[key]||0)+1; } });
  const total = perDay.reduce((a,b)=>a+b,0);
  const pmCore = list.filter(x=>D.subjects[x.s].core)
    .reduce((n,x)=>n + [...Array(x.len)].filter((_,k)=>!G.morning.includes(perOf(x.slot+k))).length, 0);
  const coreTotal = list.filter(x=>D.subjects[x.s].core).reduce((n,x)=>n+x.len,0);

  sb.innerHTML = `<div class="eyebrow">${D.teachers[tid].name}</div>
    <div class="kv"><span>本週節數</span><b>${total}</b></div>
    <div class="kv"><span>日上限</span><b>${cap} 節</b></div>`;
  const dr = el('div'); dr.style.marginTop='12px';
  dr.appendChild(el('div','eyebrow','每日節數'));
  const row = el('div','dayrow'); row.style.marginTop='6px';
  perDay.forEach((n,i)=>{ const d=el('span','daybox'+(n>cap?' over':(n===0?' zero':'')), String(n));
    d.title='週'+DAYS[i]; row.appendChild(d); });
  dr.appendChild(row); sb.appendChild(dr);

  const issues = [];
  perDay.forEach((n,i)=>{ if(n>cap) issues.push(['bad',`週${DAYS[i]} ${n} 節，超過日上限 ${cap} 節`]); });
  Object.entries(bySubDay).forEach(([k,n])=>{
    const [sid,d] = k.split('|');
    const lim = sid==='MA' ? 1 : (sid==='CH' ? 2 : 99);
    if(n>lim) issues.push(['warn',`週${DAYS[d-1]}的${D.subjects[sid].name} ${n} 節，建議一天不超過 ${lim} 節`]);
  });
  if(pmCore) issues.push(['warn',`有 ${pmCore} 節主科排在下午（共 ${coreTotal} 節主科）`]);
  D.constraints.filter(c=>c.kind==='TEACHER_DAY_OFF' && c.params.teacher===tid).forEach(c=>{
    const n = perDay[c.params.day-1];
    issues.push(n===0 ? ['ok',`週${DAYS[c.params.day-1]}不排課的需求已滿足`]
                      : ['warn',`希望週${DAYS[c.params.day-1]}不排課，目前仍有 ${n} 節`]);
  });
  const box = el('div'); box.style.marginTop='14px';
  box.appendChild(el('div','eyebrow','檢核'));
  if(!issues.length){ const n=el('div','note ok','沒有任何衝突或建議事項。'); n.style.marginTop='7px'; box.appendChild(n); }
  else issues.slice(0,6).forEach(([tone,txt])=>{ const n=el('div','note '+tone,txt);
    n.style.marginTop='7px'; box.appendChild(n); });
  sb.appendChild(box);
  const hint = el('div','note info','硬性衝突（班級／教師／教室撞堂）在這個畫面<b>不可能發生</b> —— 導師只能動自己班的空格。所以這裡列的都是品質建議。');
  hint.style.marginTop='14px'; sb.appendChild(hint);
}

/* ============ 步驟 5 三視角檢視 ============ */
let vMode='class', vKey=null;
let vSel=null, vPlan=null, vStat=null, undoStack=[];

// D.placements 是唯一的真相來源（導師自排與連動調整都直接改它）
function allPlacements(){ return D.placements; }

function snapAll(){ return D.placements.map(p=>({slot:p.slot, r:p.r})); }
function applySnap(sn){ sn.forEach((o,i)=>{ D.placements[i].slot=o.slot; D.placements[i].r=o.r; }); }

function applyPlan(plan){
  undoStack.push(snapAll()); if(undoStack.length>20) undoStack.shift();
  plan.moves.forEach(m=>{ D.placements[m.i].slot = m.to.slot; D.placements[m.i].r = m.to.room; });
  snapshotP2(); saveAll();
  vSel=null; vPlan=null; vStat=null;
  refreshStats(); renderView();
}

function renderView(){
  const p = document.getElementById('p-view'); p.innerHTML='';
  p.appendChild(el('p','lede','三種課表是<strong>同一份資料的三種投影</strong>。'
    +'點一堂課再點目標時段就能調整 —— '
    +'<span style="color:var(--ok)">綠色</span>可直接放，'
    +'<span style="color:var(--warn)">黃色</span>要<strong>連帶挪動別的課</strong>（會先讓你確認），'
    +'<span style="color:var(--bad)">紅色</span>放不了。'
    +'<br>科任老師同一時段在別班有課、專科教室被別班佔用 —— 所以挪一堂音樂課，'
    +'常常得連帶挪動另外兩個班的音樂課。'));

  const bar = el('div'); bar.style.cssText='display:flex;gap:9px;align-items:center;margin-bottom:16px;flex-wrap:wrap';
  const seg = el('div','seg');
  [['class','班級'],['teacher','教師'],['room','教室']].forEach(([m,t])=>{
    const b=el('button',null,t); b.setAttribute('aria-pressed', m===vMode);
    b.onclick=()=>{ vMode=m; vKey=null; vSel=null; vPlan=null; vStat=null; renderView(); };
    seg.appendChild(b);
  });
  const sel = el('select');
  const opts = vMode==='class' ? Object.entries(D.classes).map(([i,c])=>[i,c.name])
    : vMode==='teacher' ? TROWS().map(l=>[l.id, l.name])
    : Object.entries(D.rooms).map(([i,r])=>[i,r.name]);
  if(!vKey) vKey = opts[0][0];
  opts.forEach(([id,n])=>{ const o=el('option',null,n); o.value=id; if(id===vKey)o.selected=true; sel.appendChild(o); });
  sel.onchange=()=>{ vKey=sel.value; vSel=null; vPlan=null; vStat=null; renderView(); };
  bar.appendChild(seg); bar.appendChild(sel);
  const undo = el('button','btn','復原'); undo.disabled = !undoStack.length;
  undo.onclick=()=>{ const sn=undoStack.pop(); if(sn){ applySnap(sn); snapshotP2(); saveAll();
    vSel=null; vPlan=null; vStat=null; refreshStats(); renderView(); } };
  bar.appendChild(undo);
  if(vSel!=null){
    const cancel = el('button','btn','取消選取');
    cancel.onclick=()=>{ vSel=null; vPlan=null; vStat=null; renderView(); };
    bar.appendChild(cancel);
  }
  const spacer = el('div'); spacer.style.flex='1'; bar.appendChild(spacer);
  const pr = el('button','btn','列印全部課表');
  pr.onclick=()=>{ buildPrintArea(); setTimeout(()=>window.print(), 60); };
  const cs = el('button','btn','下載 CSV');
  cs.onclick=()=>downloadText(timetableCSV(),'timetable.csv','text/csv;charset=utf-8');
  const cc = el('button','btn','複製 CSV');
  cc.onclick=()=>copyText(timetableCSV(), cc, '複製 CSV');
  bar.appendChild(pr); bar.appendChild(cs); bar.appendChild(cc);
  p.appendChild(bar);

  const mine = D.placements.filter(x => vMode==='class' ? x.c===vKey
    : vMode==='teacher' ? x.t===vKey : x.r===vKey);
  const occ = {}; mine.forEach(x=>{ occ[x.slot]=x; });
  const blocked = vMode==='class' ? D.classes[vKey].blocked
                : vMode==='teacher' ? teacherHardBlocked(vKey) : [];

  const card = el('div','card');
  const title = vMode==='class' ? D.classes[vKey].name
    : vMode==='teacher' ? D.teachers[vKey].name : D.rooms[vKey].name;
  const slots = mine.reduce((n,x)=>n+x.len,0);
  const h = el('div','card-h', `<h3>${title}</h3>`);
  h.appendChild(el('div','legend', `<span class="mono">${slots} 節</span>`
    + (vMode==='room' ? `<span class="mono">使用率 ${Math.round(slots/(G.days*G.periods)*100)}%</span>` : '')));
  card.appendChild(h);

  const b = el('div','card-b');
  b.appendChild(grid({occupied:occ, blocked, cellFn:(s,it,bl)=>{
    if(it){
      const c = lessonCell(it,{sub2: vMode==='class' ? 'teacher' : 'class', movable:true});
      if(vSel!=null && D.placements[vSel]===it) c.classList.add('sel');
      else if(vStat && vStat[s]) c.classList.add('rt-'+vStat[s]);
      return c;
    }
    const c = emptyCell(bl);
    if(vStat && !bl){
      const st = vStat[s];
      if(st==='ok'){ c.classList.add('tgt-ok'); c.appendChild(el('div','t2','放這裡')); }
      else if(st==='ripple'){ c.classList.add('tgt-rip'); c.appendChild(el('div','t2','需連動')); }
      else if(st==='no') c.classList.add('tgt-no');
    }
    return c;
  }, onCell:(s,it)=>{
    const idx = it ? D.placements.indexOf(it) : null;
    if(vSel==null){                                  // 還沒選 → 選起來
      if(idx!=null){ vSel=idx; vPlan=null; vStat=computeStatus(idx); renderView(); }
      return;
    }
    if(idx===vSel){                                  // 再點自己 → 取消
      vSel=null; vStat=null; vPlan=null; renderView(); return;
    }
    // 已選取時點任何一格都是「移到這裡」—— 包含別堂課上面（也就是對調），
    // 因為把一堂課拖到另一堂課上面去換，才是大家最直覺的動作
    const plan = planMove(vSel, s);
    if(!plan.ok){ showViewMsg('note bad', '不能放這裡：'+plan.reason); return; }
    if(plan.moves.length===1) applyPlan(plan);
    else { vPlan = {plan, target:s}; renderView(); }
  }}));
  const lg = el('div','legend'); lg.style.marginTop='12px';
  lg.innerHTML = vSel!=null
    ? '<span>再點一次取消選取；點在別堂課上就是與它對調</span>'
      +'<span><span class="sw" style="background:var(--ok-bg);border-color:var(--ok)"></span>直接可放</span>'
      +'<span><span class="sw" style="background:var(--warn-bg);border-color:var(--warn)"></span>需連帶挪動別的課</span>'
      +'<span><span class="sw" style="background:var(--bad-bg);border-color:var(--bad)"></span>放不了</span>'
    : '<span>點一堂課開始調整</span>';
  b.appendChild(lg);
  const msg = el('div'); msg.id='view-msg'; msg.style.marginTop='10px'; b.appendChild(msg);
  card.appendChild(b); p.appendChild(card);

  if(vPlan) p.appendChild(planPanel());

  const ver = el('div'); ver.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:16px';
  const clash = countClashes(D.placements);
  [['班級衝堂',clash.c],['教師衝堂',clash.t],['教室衝堂',clash.r],['節數不符',countShort(D.placements)]]
    .forEach(([lab,n])=>{
      const c=el('div','card'), bb=el('div','card-b');
      bb.innerHTML = `<div class="eyebrow">${lab}</div>
        <div class="mono" style="font-size:27px;font-weight:600;margin-top:5px;color:var(--${n?'bad':'ok'})">${n}<span style="font-size:13px;color:var(--ink-3)"> 件</span></div>`;
      c.appendChild(bb); ver.appendChild(c);
    });
  p.appendChild(ver);
  const nb = el('div','note info'); nb.style.marginTop='14px';
  nb.innerHTML = '這四個數字每次調整後即時重算，而且<b>永遠會是 0</b> —— '
    + '連動調整只走合法的落點，不會產生撞堂。';
  p.appendChild(nb);
}

/* 每一格點下去會怎樣，先算好才能上色 */
function computeStatus(idx){
  const b = mkBoard(), out = {};
  for(let s=0;s<b.ctx.NS;s++) out[s] = slotStatus(b, idx, s);
  const cur = D.placements[idx];
  for(let k=0;k<cur.len;k++) out[cur.slot+k] = null;
  return out;
}
function showViewMsg(cls, html){
  const m = document.getElementById('view-msg'); if(!m) return;
  m.innerHTML=''; m.appendChild(el('div',cls,html));
  setTimeout(()=>{ if(m) m.innerHTML=''; }, 3600);
}

/* 連動調整的確認畫面：套用之前先看清楚有哪些課會跟著動 */
function planPanel(){
  const {plan, target} = vPlan;
  const card = el('div','card'); card.style.marginTop='16px';
  const lead = plan.moves.find(m=>m.i===vSel) || plan.moves[0];
  card.appendChild(el('div','card-h','<h3>這次調整會動到 '+plan.moves.length+' 堂課</h3>'));
  const b = el('div','card-b');
  const li = (m, primary)=>{
    const row = el('div','mv-row'+(primary?' primary':''));
    row.innerHTML = `<span class="chip ${roleOf(m.t)}">${ROLE_TXT[roleOf(m.t)]}</span>
      <span class="mv-who">${D.classes[m.c].name}　${D.subjects[m.s].name}</span>
      <span class="mono mv-slot">${G_label(m.from.slot)}</span>
      <span class="mv-arrow">→</span>
      <span class="mono mv-slot to">${G_label(m.to.slot)}</span>
      ${m.from.room!==m.to.room ? `<span class="mv-room">${D.rooms[m.to.room].name}</span>` : ''}`;
    return row;
  };
  b.appendChild(el('div','eyebrow','你要移動的'));
  const wrap1 = el('div'); wrap1.style.marginTop='7px'; wrap1.appendChild(li(lead,true)); b.appendChild(wrap1);
  const rest = plan.moves.filter(m=>m!==lead);
  if(rest.length){
    const e2 = el('div','eyebrow','連帶要跟著動的'); e2.style.marginTop='16px'; b.appendChild(e2);
    const wrap2 = el('div'); wrap2.style.cssText='margin-top:7px;display:flex;flex-direction:column;gap:6px';
    rest.forEach(m=>wrap2.appendChild(li(m,false)));
    b.appendChild(wrap2);
    const other = [...new Set(rest.map(m=>m.c))].filter(c=>c!==lead.c);
    if(other.length){
      const n = el('div','note warn'); n.style.marginTop='14px';
      n.innerHTML = `其中 <b>${other.map(c=>D.classes[c].name).join('、')}</b> 是<b>別的班級</b>，`
        + '在目前這個畫面上看不到。原因是同一位科任老師或同一間專科教室被跨班共用。';
      b.appendChild(n);
    }
  }
  const act = el('div'); act.style.cssText='display:flex;gap:9px;margin-top:18px;flex-wrap:wrap';
  const ok = el('button','btn on','套用這次調整');
  ok.onclick=()=>applyPlan(plan);
  const no = el('button','btn','取消');
  no.onclick=()=>{ vPlan=null; renderView(); };
  act.appendChild(ok); act.appendChild(no); b.appendChild(act);
  card.appendChild(b); return card;
}
function G_label(s){ return '週'+DAYS[dayOf(s)-1]+' 第'+perOf(s)+'節'; }

function countClashes(all){
  const seen={c:new Set(),t:new Set(),r:new Set()}, out={c:0,t:0,r:0};
  all.forEach(x=>{ for(let i=0;i<x.len;i++){ const s=x.slot+i;
    [['c',x.c],['t',x.t],['r',x.r]].forEach(([k,id])=>{ const key=id+'@'+s;
      if(seen[k].has(key)) out[k]++; seen[k].add(key); }); } });
  return out;
}
function countShort(all){
  const got={};
  all.forEach(x=>{ const k=x.c+'|'+x.s; got[k]=(got[k]||0)+x.len; });
  return D.requirements.filter(r=>(got[r.c+'|'+r.s]||0)!==r.n).length;
}

function loadTS(){

      classes: [...new Set(D.requirements.filter(r=>r.t===id).map(r=>r.c))],
    })),

      .filter(c=>c.params && c.params.teacher)

/* 配課節數取自實際配課（requirements），上限則來自這裡的設定 */
function assignedPeriods(tid){
  return D.requirements.filter(r=>r.t===tid).reduce((n,r)=>n+r.n,0);
}
function teacherIssues(t){
  const out=[], total=assignedPeriods(t.id);
  if(!t.name.trim()) out.push('姓名不可空白');
  if(total > t.max) out.push(`配課 ${total} 節，超過週上限 ${t.max} 節`);
  const days = G.days;
  const dayOffs = TS.constraints.filter(c=>
    c.params.teacher===t.id && c.hard &&
    (c.kind==='TEACHER_DAY_OFF' || (c.kind==='TEACHER_UNAVAILABLE' && !c.params.periods))).length;
  const capC = TS.constraints.filter(c=>
    c.params.teacher===t.id && c.hard && c.kind==='TEACHER_MAX_PER_DAY').map(c=>c.params.max);
  const cap = Math.min(t.cap, ...(capC.length?capC:[99]));
  const freeDays = days - dayOffs;
  if(cap < G.periods && total > cap*freeDays)
    out.push(`配課 ${total} 節，但一天最多 ${cap} 節 × ${freeDays} 個可上課日 = ${cap*freeDays} 節`);
  return out;
}

// days／periods 任一邊沒選就代表「全部」，描述文字要跟著變，不能寫死成兩段
function spanText(p){
  const d = p.days && p.days.length ? '週'+p.days.map(x=>DAYS[x-1]).join('、') : '每天';
  const q = p.periods && p.periods.length ? '第 '+p.periods.join('、')+' 節' : '整天';
  return d + (q==='整天' ? '' : '的' + q);
}
function describeConstraint(c){
  const p = c.params;
  switch(c.kind){
    case 'TEACHER_DAY_OFF':     return `週${DAYS[p.day-1]}完全不排課`;
    case 'TEACHER_UNAVAILABLE': return spanText(p) + '不排課';
    case 'TEACHER_ONLY_IN':     return '只排在' + spanText(p);
    case 'TEACHER_MAX_PER_DAY': return `一天最多 ${p.max} 節`;
    case 'TEACHER_MAX_RUN':     return `最多連續 ${p.max} 節`;
    case 'TEACHER_COMPACT':     return '課表不要有零星空堂';
    default: return c.kind;
  }
}

function teachersJSON(){
  const out = {
    teachers: TS.teachers.map(t=>({
      id:t.id, name:t.name, role:t.role,
      max_per_week:t.max, max_per_day:t.cap,
    })),
    constraints: TS.constraints.map(c=>({
      kind:c.kind, params:c.params,
      hardness: c.hard ? 'hard' : 'soft',
      weight: c.weight || 1,
    })),
  };
  return JSON.stringify(out, null, 2);
}


/* 老師設定的修改要讓後續畫面都看得到，所以同步回共用的資料表 */
function syncD(){
  TS.teachers.forEach(t=>{
    D.teachers[t.id] = Object.assign(D.teachers[t.id] || {}, 
      {name:t.name, role:t.role, max:t.max, cap:t.cap, subjects:t.subjects.slice()});
  });
  // 個人需求也要寫回共用資料，否則在畫面上改了需求，排課時根本讀不到。
  // 班級／科目層級的需求（例如「主科排上午」）不歸老師管，原樣保留。
  const shared = D.constraints.filter(c=>!(c.params && c.params.teacher));
  D.constraints = shared.concat(TS.constraints.map(c=>({
    kind:c.kind, params:c.params, hard:!!c.hard, weight:c.weight||1,
  })));
}
function TROWS(){
  if(!TS) TS = loadTS();
  return TS.teachers.map(t=>({
    id:t.id, name:t.name, role:t.role, max:t.max, cap:t.cap,
    subjects:t.subjects, total:assignedPeriods(t.id),
    classes:[...new Set(D.requirements.filter(r=>r.t===t.id).map(r=>r.c))],
  }));

/* ===== SCHEDULER START =====
   瀏覽器端排課引擎。

   跟 prototype/ 的 CP-SAT 版本是同一個模型，但求解策略不同：
     CP-SAT  在整個解空間上搜尋，能證明最佳性
     這裡    用「先貪婪塞滿、再模擬退火改良」，不保證最佳，但不需要後端

   關鍵設計：硬約束永遠當成不變量維護 —— 只在「不會撞堂的位置」之間移動，
   所以任何時刻的解都是合法的，隨時可以停下來取用。軟需求則化成加權成本，
   由退火去壓低。這樣即使跑得不夠久，也只會是「品質差一點」，
   絕不會吐出一份有老師同時教兩班的課表。                                    */

const SW = {
  TEACHER_DAY_OFF:100, TEACHER_UNAVAILABLE:100, TEACHER_ONLY_IN:100, TEACHER_MAX_PER_DAY:40,
  TEACHER_MAX_RUN:20, SUBJECT_SPREAD:10, TEACHER_COMPACT:5, SUBJECT_NOT_IN:8,
  CORE_IN_MORNING:2, HOMEROOM_DAY_CAPACITY:500, HOMEROOM_DAY_OFF:150,
  RESERVE_MORNING:30, SPECIAL_BALANCE:15,
};
const HANDOFF = new Set(['HOMEROOM_DAY_CAPACITY','HOMEROOM_DAY_OFF','RESERVE_MORNING','SPECIAL_BALANCE']);

function mkCtx(D){
  const g = D.grid, NS = g.days*g.periods;
  const dayOf = s=>Math.floor(s/g.periods)+1, perOf = s=>s%g.periods+1;
  const canDbl = s=>perOf(s)<g.periods && !g.breaks.includes(perOf(s));

  const wOf = c => (c.weight && c.weight!==1) ? c.weight : (SW[c.kind]||1);
  const expand = p=>{
    const out=new Set();
    const ds = p.days || Array.from({length:g.days},(_,i)=>i+1);
    const ps = p.periods || Array.from({length:g.periods},(_,i)=>i+1);
    ds.forEach(d=>ps.forEach(q=>out.add((d-1)*g.periods+(q-1))));
    return out;
  };
  const tBlocked={}, sBlocked={};
  Object.keys(D.teachers).forEach(t=>tBlocked[t]=new Set());
  Object.keys(D.subjects).forEach(s=>sBlocked[s]=new Set());
  D.constraints.forEach(c=>{
    if(!c.hard) return;
    const p=c.params||{};
    if(c.kind==='TEACHER_UNAVAILABLE' && p.teacher) expand(p).forEach(s=>tBlocked[p.teacher].add(s));
    if(c.kind==='TEACHER_ONLY_IN' && p.teacher){
      // 「只排這些時段」＝「其餘全部不可排」
      const ok=expand(p);
      for(let s=0;s<g.days*g.periods;s++) if(!ok.has(s)) tBlocked[p.teacher].add(s);
    }
    if(c.kind==='TEACHER_DAY_OFF' && p.teacher)
      for(let q=1;q<=g.periods;q++) tBlocked[p.teacher].add((p.day-1)*g.periods+(q-1));
    if(c.kind==='SUBJECT_NOT_IN' && p.subject)
      for(let d=1;d<=g.days;d++) (p.periods||[]).forEach(q=>sBlocked[p.subject].add((d-1)*g.periods+(q-1)));
  });
  const cBlocked={};
  Object.entries(D.classes).forEach(([id,c])=>cBlocked[id]=new Set(c.blocked));

  const roomsOf={};
  Object.entries(D.rooms).forEach(([id,r])=>{ (roomsOf[r.type]=roomsOf[r.type]||[]).push(id); });
  const rcache = {}, rset = {};
  const rkey = u => u.s + '|' + u.c;
  const candRooms = u => {
    const k = rkey(u);
    if(!rcache[k]){
      rcache[k] = D.subjects[u.s].room ? (roomsOf[D.subjects[u.s].room]||[]) : [D.classes[u.c].room];
      rset[k] = new Set(rcache[k]);
    }
    return rcache[k];
  };
  // 對調兩堂課時會直接沿用對方的教室，所以教室是否合法必須在 canPlace 裡把關，
  // 不能只靠產生候選位置時過濾 —— 否則體育課會被換進音樂教室。
  const roomOk = (u, room) => { candRooms(u); return rset[rkey(u)].has(room); };

  const hrOf = {};                       // 班級 -> 導師
  D.requirements.forEach(r=>{
    if(!hrOf[r.c] && D.teachers[r.t] && D.teachers[r.t].role==='homeroom') hrOf[r.c]=r.t;
  });
  const teachable = {};                  // 班級 -> 每天要上課的節數
  Object.keys(D.classes).forEach(cid=>{
    teachable[cid]=[];
    for(let d=1;d<=g.days;d++){
      let n=0; for(let q=1;q<=g.periods;q++) if(!cBlocked[cid].has((d-1)*g.periods+(q-1))) n++;
      teachable[cid].push(n);
    }
  });
  return {D,g,NS,dayOf,perOf,canDbl,tBlocked,sBlocked,cBlocked,candRooms,roomOk,hrOf,teachable,wOf,expand};
}

function buildUnits(D){
  const u=[];
  D.requirements.forEach(r=>{
    const dbl=r.d||0;
    for(let i=0;i<dbl;i++) u.push({i:u.length,c:r.c,s:r.s,t:r.t,len:2});
    for(let i=0;i<r.n-2*dbl;i++) u.push({i:u.length,c:r.c,s:r.s,t:r.t,len:1});
  });
  return u;
}

/* ---------- 佔用狀態：硬約束就靠它維持 ---------- */
function mkState(ctx, units, fixed){
  const NS=ctx.NS, occC={}, occT={}, occR={}, tDay={};
  Object.keys(ctx.D.classes).forEach(k=>occC[k]=new Int32Array(NS).fill(-1));
  Object.keys(ctx.D.teachers).forEach(k=>{ occT[k]=new Int32Array(NS).fill(-1);
    tDay[k]=new Int32Array(ctx.g.days+1); });
  Object.keys(ctx.D.rooms).forEach(k=>occR[k]=new Int32Array(NS).fill(-1));
  const st={occC,occT,occR,tDay,pos:{},units};
  (fixed||[]).forEach(p=>{
    for(let k=0;k<p.len;k++){
      const s=p.slot+k;
      occC[p.c][s]=-2; occT[p.t][s]=-2; if(occR[p.r]) occR[p.r][s]=-2;
      tDay[p.t][ctx.dayOf(s)]++;
    }
  });
  return st;
}
function canPlace(ctx, st, u, slot, room){
  if(!ctx.roomOk(u, room)) return false;
  if(u.len===2 && !ctx.canDbl(slot)) return false;
  const cap = ctx.D.teachers[u.t].cap;
  const d = ctx.dayOf(slot);
  if(st.tDay[u.t][d] + u.len > cap) return false;
  for(let k=0;k<u.len;k++){
    const s=slot+k;
    if(s>=ctx.NS || ctx.dayOf(s)!==d) return false;
    if(ctx.cBlocked[u.c].has(s) || ctx.tBlocked[u.t].has(s) || ctx.sBlocked[u.s].has(s)) return false;
    if(st.occC[u.c][s]!==-1 || st.occT[u.t][s]!==-1 || st.occR[room][s]!==-1) return false;
  }
  return true;
}
function place(ctx, st, u, slot, room){
  for(let k=0;k<u.len;k++){ const s=slot+k;
    st.occC[u.c][s]=u.i; st.occT[u.t][s]=u.i; st.occR[room][s]=u.i; }
  st.tDay[u.t][ctx.dayOf(slot)] += u.len;
  st.pos[u.i]={slot,room};
}
function unplace(ctx, st, u){
  const p=st.pos[u.i]; if(!p) return null;
  for(let k=0;k<u.len;k++){ const s=p.slot+k;
    st.occC[u.c][s]=-1; st.occT[u.t][s]=-1; st.occR[p.room][s]=-1; }
  st.tDay[u.t][ctx.dayOf(p.slot)] -= u.len;
  delete st.pos[u.i];
  return p;
}
function legalSpots(ctx, st, u){
  const out=[];
  for(let s=0;s<ctx.NS;s++) for(const r of ctx.candRooms(u))
    if(canPlace(ctx,st,u,s,r)) out.push([s,r]);
  return out;
}

/* ---------- 成本：軟需求 ---------- */
function penalty(ctx, st, units, opts){
  const D=ctx.D, g=ctx.g; let total=0;
  const detail = opts && opts.detail ? {} : null;
  const add=(v,w,label)=>{ if(v<=0) return; total+=v*w;
    if(detail) detail[label]=(detail[label]||0)+v*w; };

  const tDay={}, tBusy={}, csDay={};
  units.forEach(u=>{
    const p=st.pos[u.i]; if(!p) return;
    for(let k=0;k<u.len;k++){
      const s=p.slot+k, d=ctx.dayOf(s);
      (tDay[u.t]=tDay[u.t]||{})[d]=(tDay[u.t][d]||0)+1;
      (tBusy[u.t]=tBusy[u.t]||new Set()).add(s);
      const key=u.c+'|'+u.s+'|'+d; csDay[key]=(csDay[key]||0)+1;
    }
  });
  const busy=(t,s)=>tBusy[t]&&tBusy[t].has(s)?1:0;

  D.constraints.forEach(c=>{
    if(c.hard) return;
    if(!opts.handoff && HANDOFF.has(c.kind)) return;
    const w=ctx.wOf(c), p=c.params||{}, t=p.teacher, nm=t&&D.teachers[t]?D.teachers[t].name:'';
    switch(c.kind){
      case 'TEACHER_DAY_OFF':
        if(!t) break;
        add((tDay[t]&&tDay[t][p.day])||0, w, `${nm} 希望週${'一二三四五'[p.day-1]}不排課`); break;
      case 'TEACHER_UNAVAILABLE': {
        if(!t) break; let n=0; ctx.expand(p).forEach(s=>n+=busy(t,s));
        add(n, w, `${nm} 希望避開指定時段`); break;
      }
      case 'TEACHER_ONLY_IN': {
        if(!t) break;
        const ok=ctx.expand(p); let n=0;
        for(let s=0;s<ctx.NS;s++) if(!ok.has(s)) n+=busy(t,s);
        add(n, w, `${nm} 只在指定時段排課`); break;
      }
      case 'TEACHER_MAX_PER_DAY':
        if(!t) break;
        for(let d=1;d<=g.days;d++) add(Math.max(0,((tDay[t]&&tDay[t][d])||0)-p.max), w,
          `${nm} 一天最多 ${p.max} 節`);
        break;
      case 'TEACHER_MAX_RUN':
        if(!t) break;
        for(let d=1;d<=g.days;d++) for(let i=1;i+p.max<=g.periods;i++){
          let n=0; for(let q=i;q<=i+p.max;q++) n+=busy(t,(d-1)*g.periods+(q-1));
          add(Math.max(0,n-p.max), w, `${nm} 連續上課不超過 ${p.max} 節`);
        }
        break;
      case 'TEACHER_COMPACT':
        if(!t) break;
        for(let d=1;d<=g.days;d++) for(let q=1;q+2<=g.periods;q++){
          const b=i=>busy(t,(d-1)*g.periods+(i-1));
          if(b(q)&&!b(q+1)&&b(q+2)) add(1,w,`${nm} 課表中的零星空堂`);
        }
        break;
      case 'SUBJECT_SPREAD':
        Object.keys(D.classes).forEach(cid=>{ for(let d=1;d<=g.days;d++)
          add(Math.max(0,(csDay[cid+'|'+p.subject+'|'+d]||0)-p.max), w,
            `${D.classes[cid].name} 的${D.subjects[p.subject].name}一天不超過 ${p.max} 節`); });
        break;
      case 'SUBJECT_NOT_IN': {
        let n=0;
        units.forEach(u=>{ if(u.s!==p.subject) return; const q=st.pos[u.i]; if(!q) return;
          for(let k=0;k<u.len;k++) if(p.periods.includes(ctx.perOf(q.slot+k))) n++; });
        add(n,w,`${D.subjects[p.subject].name}避開第 ${p.periods.join('、')} 節`); break;
      }
      case 'CORE_IN_MORNING': {
        let n=0;
        units.forEach(u=>{ if(!D.subjects[u.s].core) return; const q=st.pos[u.i]; if(!q) return;
          for(let k=0;k<u.len;k++) if(!g.morning.includes(ctx.perOf(q.slot+k))) n++; });
        add(n,w,'主科盡量排在上午'); break;
      }
      /* ---- 交接：本階段（科任）要為導師留下能用的空格 ---- */
      case 'HOMEROOM_DAY_CAPACITY':
        Object.keys(D.classes).forEach(cid=>{
          const hr=ctx.hrOf[cid]; if(!hr) return;
          const cap=D.teachers[hr].cap;
          for(let d=1;d<=g.days;d++){
            const floor=ctx.teachable[cid][d-1]-cap; if(floor<=0) continue;
            let occ=0;
            units.forEach(u=>{ if(u.c!==cid) return; const q=st.pos[u.i]; if(!q) return;
              for(let k=0;k<u.len;k++) if(ctx.dayOf(q.slot+k)===d) occ++; });
            add(Math.max(0,floor-occ), w,
              `${D.classes[cid].name} 週${'一二三四五'[d-1]}留給導師的空格超出其日上限`);
          }
        });
        break;
      case 'HOMEROOM_DAY_OFF':
        D.constraints.forEach(dc=>{
          if(dc.kind!=='TEACHER_DAY_OFF') return;
          const tt=dc.params.teacher, T=D.teachers[tt];
          if(!T || T.role!=='homeroom') return;
          Object.keys(D.classes).forEach(cid=>{
            if(ctx.hrOf[cid]!==tt) return;
            const d=dc.params.day; let occ=0;
            units.forEach(u=>{ if(u.c!==cid) return; const q=st.pos[u.i]; if(!q) return;
              for(let k=0;k<u.len;k++) if(ctx.dayOf(q.slot+k)===d) occ++; });
            add(Math.max(0, ctx.teachable[cid][d-1]-occ), ctx.wOf(dc),
              `${T.name} 希望週${'一二三四五'[d-1]}不排課`);
          });
        });
        break;
      case 'RESERVE_MORNING':
        Object.keys(D.classes).forEach(cid=>{
          let n=0;
          units.forEach(u=>{ if(u.c!==cid) return; const q=st.pos[u.i]; if(!q) return;
            for(let k=0;k<u.len;k++) if(g.morning.includes(ctx.perOf(q.slot+k))) n++; });
          add(Math.max(0,n-p.max_per_class), w,
            `${D.classes[cid].name} 上午被科任佔用不超過 ${p.max_per_class} 節`);
        });
        break;
      case 'SPECIAL_BALANCE':
        Object.keys(D.classes).forEach(cid=>{ for(let d=1;d<=g.days;d++){
          let n=0;
          units.forEach(u=>{ if(u.c!==cid) return; const q=st.pos[u.i]; if(!q) return;
            for(let k=0;k<u.len;k++) if(ctx.dayOf(q.slot+k)===d) n++; });
          add(Math.max(0,n-p.max_per_day), w,
            `${D.classes[cid].name} 每天科任課不超過 ${p.max_per_day} 節`);
        }});
        break;
    }
  });
  return detail ? {total, detail} : total;
}

/* ---------- 貪婪初始解：先塞最難塞的，塞不下就把佔位的踢出來重排 ---------- */
function greedy(ctx, st, units, rnd){
  const queue = units.slice().sort((a,b)=>
    legalSpots(ctx,st,a).length - legalSpots(ctx,st,b).length);
  let guard = units.length*80;
  const pending = queue.slice();
  while(pending.length && guard-- > 0){
    const u = pending.shift();
    const spots = legalSpots(ctx, st, u);
    if(spots.length){
      const [s,r] = spots[(rnd()*spots.length)|0];
      place(ctx, st, u, s, r);
      continue;
    }
    // 沒有乾淨的位置：隨機挑一個合法起點，把擋路的人踢出去重排（ejection）
    const cands=[];
    for(let s=0;s<ctx.NS;s++) for(const r of ctx.candRooms(u)){
      if(u.len===2 && !ctx.canDbl(s)) continue;
      let ok=true;
      for(let k=0;k<u.len;k++){ const x=s+k;
        if(x>=ctx.NS || ctx.dayOf(x)!==ctx.dayOf(s)) {ok=false;break;}
        if(ctx.cBlocked[u.c].has(x)||ctx.tBlocked[u.t].has(x)||ctx.sBlocked[u.s].has(x)){ok=false;break;}
        if(st.occC[u.c][x]===-2||st.occT[u.t][x]===-2||st.occR[r][x]===-2){ok=false;break;}
      }
      if(ok) cands.push([s,r]);
    }
    if(!cands.length) return false;
    const [s,r]=cands[(rnd()*cands.length)|0];
    const evicted=new Set();
    for(let k=0;k<u.len;k++){ const x=s+k;
      [st.occC[u.c][x], st.occT[u.t][x], st.occR[r][x]].forEach(id=>{ if(id>=0) evicted.add(id); }); }
    evicted.forEach(id=>{ unplace(ctx,st,units.find(v=>v.i===id)); });
    if(!canPlace(ctx,st,u,s,r)){ evicted.forEach(id=>pending.push(units.find(v=>v.i===id))); pending.push(u); continue; }
    place(ctx,st,u,s,r);
    evicted.forEach(id=>pending.push(units.find(v=>v.i===id)));
  }
  return pending.length===0 && units.every(u=>st.pos[u.i]);
}

/* ---------- 模擬退火：只在合法位置之間移動／對調 ---------- */
function restore(ctx, st, units, pos){
  units.forEach(u=>{ if(st.pos[u.i]) unplace(ctx,st,u); });
  units.forEach(u=>{ const p=pos[u.i]; if(p) place(ctx,st,u,p.slot,p.room); });
}
function snapshot(st, units){
  const o={}; units.forEach(u=>{ const p=st.pos[u.i]; if(p) o[u.i]={slot:p.slot,room:p.room}; });
  return o;
}
// 讓出控制權給瀏覽器。setTimeout 有 4ms 的最小延遲，MessageChannel 幾乎沒有成本，
// 所以優先用它；Node 端則走 setImmediate。
const nextTick = (typeof MessageChannel!=='undefined')
  ? (()=>{ const ch=new MessageChannel(); let cb=null;
      ch.port1.onmessage=()=>{ const f=cb; cb=null; if(f) f(); };
      return ()=>new Promise(r=>{ cb=r; ch.port2.postMessage(0); }); })()
  : (typeof setImmediate!=='undefined' ? ()=>new Promise(r=>setImmediate(r))
                                       : ()=>new Promise(r=>setTimeout(r,0)));

async function anneal(ctx, st, units, opts){
  const rnd=opts.rnd, deadline=Date.now()+opts.ms;
  const slice = opts.slice || 25;      // 每跑這麼多毫秒就讓出一次
  let sliceEnd = Date.now()+slice;
  let cur = penalty(ctx, st, units, opts);
  let best = cur, bestPos = snapshot(st, units);
  let T = Math.max(20, cur/8), iter=0;

  while(best>0 && Date.now()<deadline){
    if(Date.now()>=sliceEnd){
      if(opts.onTick) opts.onTick({best, iter, phase:opts.phase,
        left:Math.max(0, deadline-Date.now())});
      if(opts.cancelled && opts.cancelled()) break;
      await nextTick();
      sliceEnd = Date.now()+slice;
    }
    iter++;
    const u = units[(rnd()*units.length)|0];
    const from = st.pos[u.i]; if(!from) continue;

    // 每一步都記下確切做了什麼，退回時才能精準還原，不必整盤重建
    let undo = null;
    unplace(ctx, st, u);
    if(rnd()<0.72){
      const spots = legalSpots(ctx, st, u);
      if(!spots.length){ place(ctx,st,u,from.slot,from.room); continue; }
      const [s,r] = spots[(rnd()*spots.length)|0];
      place(ctx, st, u, s, r);
      undo = ()=>{ unplace(ctx,st,u); place(ctx,st,u,from.slot,from.room); };
    } else {
      const v = units[(rnd()*units.length)|0];
      const to = (v.i!==u.i) ? st.pos[v.i] : null;
      if(!to){ place(ctx,st,u,from.slot,from.room); continue; }
      unplace(ctx, st, v);
      if(!canPlace(ctx,st,u,to.slot,to.room)){
        place(ctx,st,v,to.slot,to.room); place(ctx,st,u,from.slot,from.room); continue;
      }
      place(ctx,st,u,to.slot,to.room);
      if(!canPlace(ctx,st,v,from.slot,from.room)){
        unplace(ctx,st,u); place(ctx,st,v,to.slot,to.room); place(ctx,st,u,from.slot,from.room); continue;
      }
      place(ctx,st,v,from.slot,from.room);
      undo = ()=>{ unplace(ctx,st,u); unplace(ctx,st,v);
                   place(ctx,st,u,from.slot,from.room); place(ctx,st,v,to.slot,to.room); };
    }

    const p = penalty(ctx, st, units, opts);
    if(p<=cur || rnd()<Math.exp((cur-p)/T)){
      cur = p;
      if(p<best){ best=p; bestPos = snapshot(st, units); }
    } else undo();

    T *= 0.9997; if(T<0.4) T=0.4;
  }
  restore(ctx, st, units, bestPos);
  return {best, iter};
}

/* ---------- 對外入口：分階段排課 ---------- */
function mulberry(seed){
  return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15, 1|seed);
    t=t+Math.imul(t^t>>>7, 61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; };
}
async function schedule(D, opts){
  opts = opts || {};
  const ctx = mkCtx(D), rnd = mulberry(opts.seed||1);
  const all = buildUnits(D);
  const p1 = all.filter(u=>D.teachers[u.t].role!=='homeroom');
  const p2 = all.filter(u=>D.teachers[u.t].role==='homeroom');
  const t0 = Date.now();

  // Phase 1：科任與兼行政，全校一起排。目標式包含「為導師保留空格」
  const st1 = mkState(ctx, p1, []);
  if(!greedy(ctx, st1, p1, rnd)) return {ok:false, reason:'科任課排不進去，請檢查配課與專科教室數量'};
  const r1 = await anneal(ctx, st1, p1, {rnd, ms: opts.ms1 ?? 3000, handoff:true,
    onTick: opts.onTick, cancelled: opts.cancelled, phase:1});
  const fixed = p1.map(u=>({c:u.c,s:u.s,t:u.t,len:u.len,slot:st1.pos[u.i].slot,r:st1.pos[u.i].room}));

  // Phase 2：導師的課逐班獨立排 —— 班與班之間沒有任何交互作用
  const out = fixed.slice(), failed=[]; let pen2=0;
  const cids = Object.keys(D.classes);
  for(const cid of cids){
    const mine = p2.filter(u=>u.c===cid);
    if(!mine.length) continue;
    const st2 = mkState(ctx, mine, fixed);
    if(!greedy(ctx, st2, mine, rnd)){ failed.push(cid); continue; }
    const r2 = await anneal(ctx, st2, mine, {rnd, ms: opts.ms2 ?? 250, handoff:false,
      onTick: opts.onTick, cancelled: opts.cancelled, phase:2, label:cid});
    pen2 += r2.best;
    mine.forEach(u=>out.push({c:u.c,s:u.s,t:u.t,len:u.len,
                              slot:st2.pos[u.i].slot, r:st2.pos[u.i].room}));
  }

  const stAll = mkState(ctx, all, []);
  const idx = {}; all.forEach(u=>{ (idx[u.c+'|'+u.s]=idx[u.c+'|'+u.s]||[]).push(u); });
  out.forEach(p=>{ const u=(idx[p.c+'|'+p.s]||[]).find(v=>v.len===p.len && !stAll.pos[v.i]);
                   if(u) place(ctx, stAll, u, p.slot, p.r); });
  const det = penalty(ctx, stAll, all, {handoff:false, detail:true});

  return {ok:failed.length===0, placements:out, failed,
          penalty1:r1.best, penalty2:pen2, penalty:det.total, detail:det.detail,
          iters:r1.iter, ms:Date.now()-t0};
}
/* 科任排完後，各班留給導師什麼樣的空格 —— 交接檢查畫面用 */
function handoffReport(D, phase1){
  const ctx = mkCtx(D), g=D.grid, out={};
  const used={}; Object.keys(D.classes).forEach(c=>used[c]=new Set());
  phase1.forEach(p=>{ for(let k=0;k<p.len;k++) used[p.c].add(p.slot+k); });
  Object.entries(D.classes).forEach(([cid,cls])=>{
    const blocked=new Set(cls.blocked), free=[];
    for(let s=0;s<ctx.NS;s++) if(!blocked.has(s) && !used[cid].has(s)) free.push(s);
    const fs=new Set(free);
    const per_day=[]; for(let d=1;d<=g.days;d++) per_day.push(free.filter(s=>ctx.dayOf(s)===d).length);
    const hr=ctx.hrOf[cid], cap=hr?D.teachers[hr].cap:99;
    const need=D.requirements.filter(r=>r.c===cid && D.teachers[r.t].role==='homeroom')
                             .reduce((n,r)=>n+r.n,0);
    const core=D.requirements.filter(r=>r.c===cid && D.teachers[r.t].role==='homeroom'
                             && D.subjects[r.s].core).reduce((n,r)=>n+r.n,0);
    const morning_free=free.filter(s=>g.morning.includes(ctx.perOf(s))).length;
    out[cid]={free:free.length, need, morning_free, core_need:core,
      core_fits_morning: morning_free>=core, per_day,
      day_spread: Math.max(...per_day)-Math.min(...per_day),
      double_slots: free.filter(s=>ctx.canDbl(s)&&fs.has(s+1)).length,
      cap, usable: per_day.reduce((n,x)=>n+Math.min(x,cap),0),
      over: per_day.map(n=>n>cap)};
  });
  return out;
}
/* ===== SCHEDULER END ===== */

/* ============ 線上排課 ============
   求解直接在瀏覽器裡跑，不需要後端。演算法會分時讓出控制權，
   所以求解過程中畫面不會凍住，隨時可以停 —— 停下來拿到的也是一份合法課表，
   因為硬約束全程都是不變量。                                              */


/* 排課前的可行性檢查。求解器失敗只會說「排不出來」，對使用者沒有幫助；
   絕大多數的無解在配課階段就注定了，而且用簡單的計數就能指出是誰的問題。 */
function feasibilityIssues(){
  const ctx = mkCtx(D), g = D.grid, out = [];
  const assigned = tid => D.requirements.filter(r=>r.t===tid).reduce((n,r)=>n+r.n,0);

  Object.entries(D.classes).forEach(([cid,cls])=>{
    const total = D.requirements.filter(r=>r.c===cid).reduce((n,r)=>n+r.n,0);
    const cap = ctx.NS - cls.blocked.length;
    if(total>cap) out.push(`${cls.name} 配課 ${total} 節，但一週只有 ${cap} 個可上課時段`);
  });

  Object.entries(D.teachers).forEach(([tid,t])=>{
    const total = assigned(tid); if(!total) return;
    if(total > t.max) out.push(`${t.name} 配課 ${total} 節，超過週上限 ${t.max} 節`);
    const blocked = ctx.tBlocked[tid] || new Set();
    const free = ctx.NS - blocked.size;
    if(total > free)
      out.push(`${t.name} 配課 ${total} 節，但扣掉不可排課的時段後只剩 ${free} 個時段`);
    // 一天上限 × 還能上課的天數
    let usable = 0;
    for(let d=1;d<=g.days;d++){
      let n=0; for(let q=1;q<=g.periods;q++) if(!blocked.has((d-1)*g.periods+(q-1))) n++;
      usable += Math.min(n, t.cap);
    }
    if(total > usable)
      out.push(`${t.name} 配課 ${total} 節，但每天最多 ${t.cap} 節，`
             + `扣掉不可排課的時段後實際只排得下 ${usable} 節`);
  });

  const demand = {};
  D.requirements.forEach(r=>{ const rt=D.subjects[r.s].room;
    if(rt) demand[rt]=(demand[rt]||0)+r.n; });
  Object.entries(demand).forEach(([rt,need])=>{
    const n = Object.values(D.rooms).filter(r=>r.type===rt).length;
    if(!n){ out.push(`有科目需要 ${rt} 教室，但學校沒有這種教室`); return; }
    if(need > n*ctx.NS)
      out.push(`${rt} 教室需求 ${need} 節，但 ${n} 間 × ${ctx.NS} 節 = ${n*ctx.NS} 節，容量不足`);
  });
  return out;
}

let solving = false, cancelSolve = false, hideTimer = null;

function solveBarHTML(){
  return `<div id="solve-bar" hidden>
    <div class="sb-row">
      <span class="sb-phase" id="sb-phase">準備中</span>
      <div class="sb-track"><i id="sb-fill"></i></div>
      <span class="mono sb-cost" id="sb-cost"></span>
      <button class="btn" id="sb-stop" type="button">停止</button>
    </div>
  </div>`;
}

async function runSolve(seconds){
  if(solving) return;
  solving = true; cancelSolve = false;
  // 上一輪結束後排了一個「稍後隱藏進度列」的計時器，若在它到期前又按下重新排課，
  // 它會把進行中的進度列關掉 —— 所以每次開始都要先取消它。
  if(hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
  const bar = document.getElementById('solve-bar');
  const btn = document.getElementById('solve-btn');
  const fill = document.getElementById('sb-fill');
  const ph = document.getElementById('sb-phase');
  const cost = document.getElementById('sb-cost');
  bar.hidden = false; btn.disabled = true; btn.textContent = '排課中…';

  const issues = feasibilityIssues();
  if(issues.length){
    bar.hidden = true; btn.disabled = false; btn.textContent = '重新排課'; solving = false;
    showSolveError('這些問題會讓課表排不出來，請先修正：', issues);
    return;
  }
  const ms1 = Math.round(seconds*1000*0.75), ms2 = Math.round(seconds*1000*0.25/12);
  const total = ms1 + ms2*12; const t0 = Date.now();

  try{
    const res = await schedule(D, {
      ms1, ms2, seed: (Math.random()*1e9)|0,
      onTick: ({best, phase, label})=>{
        const pct = Math.min(100, (Date.now()-t0)/total*100);
        fill.style.width = pct.toFixed(1)+'%';
        ph.textContent = phase===1 ? '科任／行政排課' : `導師排課　${D.classes[label]?D.classes[label].name:''}`;
        cost.textContent = '成本 '+best;
      },
      cancelled: ()=>cancelSolve,
    });
    if(!res.placements){
      bar.hidden=true;
      showSolveError('排不出來。', [res.reason||'請檢查配課、教師時段限制與專科教室數量。']);
      return;
    }
    applySolution(res);
    fill.style.width='100%';
    ph.textContent = res.failed.length
      ? `完成，但 ${res.failed.map(c=>D.classes[c].name).join('、')} 排不出來`
      : '完成';
    cost.textContent = `成本 ${res.penalty}　${((Date.now()-t0)/1000).toFixed(1)}s`;
    hideTimer = setTimeout(()=>{ bar.hidden=true; hideTimer=null; }, 4000);
  } finally {
    solving=false; btn.disabled=false; btn.textContent='重新排課';
  }
}

/* 把新解寫回共用資料，讓每個畫面都跟著更新 */
// 錯誤直接顯示在頁面上，不用 alert —— 清單可能有很多條，而且要看得到細節
function showSolveError(title, lines){
  const host = document.getElementById('solve-host');

function applySolution(res){
  const old = document.getElementById('solve-host').querySelector('.solve-err');
  if(old) old.remove();
  D.placements = res.placements.map(p=>({
    c:p.c, s:p.s, t:p.t, r:p.r, slot:p.slot, len:p.len,
    ph: D.teachers[p.t].role==='homeroom' ? 2 : 1,
  }));
  snapshotP2(); p2Sel = null; vSel = null; vPlan = null; undoStack.length = 0; saveAll();

  D.handoff.good = handoffReport(D, D.placements.filter(x=>x.ph===1));
  D.handoff.bad = D.handoff.good; D.handoff.stale = true;   // 對照組需另外求解
  D.solve.p1 = {
    status:'LOCAL', time:+(res.ms/1000).toFixed(1), penalty:res.penalty,
    violations: Object.entries(res.detail||{}).sort((a,b)=>b[1]-a[1])
                 .map(([k,v])=>`${k}（成本 ${v}）`),
  };
  D.solve.p2 = {}; D.solve.badFailed = res.failed;
  refreshStats();
  const i = STEPS.findIndex(([id])=>!document.getElementById(id).hidden);
  if(i>=0) STEPS[i][2]();
}
