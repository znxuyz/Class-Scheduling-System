/* ============ 連動調整引擎 ============
   手動把一堂課挪到別的時段時，被擠掉的課必須有地方去。

   為什麼會牽動別班：導師的課只在自己班，挪動不影響外人；但科任老師同一時段
   在別班有課、專科教室同一時段被別班佔用 —— 所以移動一堂音樂課，可能得連帶
   挪動另外兩個班的音樂課。這正是手排課表最容易出錯的地方，交給程式算。

   做法：先試直接對調，不行再做「連鎖遷移」（把擋路的課移到別處，必要時再擠
   走下一層），全程只走合法位置，並以軟性成本挑最不傷課表品質的落點。         */

const RIPPLE_MAX_DEPTH = 3, RIPPLE_MAX_MOVES = 8, RIPPLE_BRANCH = 5;

function mkBoard(){
  const E = D.placements.map((p,i)=>({i, c:p.c, s:p.s, t:p.t, len:p.len, slot:p.slot, room:p.r}));
  const b = {E, oc:new Map(), ot:new Map(), or:new Map(), ctx:mkCtx(D)};
  E.forEach(e=>put(b,e.i,e.slot,e.room));
  return b;
}
function put(b,i,slot,room){
  const e=b.E[i]; e.slot=slot; e.room=room; e.off=false;
  for(let k=0;k<e.len;k++){ const s=slot+k;
    b.oc.set(e.c+'@'+s,i); b.ot.set(e.t+'@'+s,i); b.or.set(room+'@'+s,i); }
}
function pull(b,i){
  const e=b.E[i]; if(e.off) return;
  for(let k=0;k<e.len;k++){ const s=e.slot+k;
    b.oc.delete(e.c+'@'+s); b.ot.delete(e.t+'@'+s); b.or.delete(e.room+'@'+s); }
  e.off = true;
}
function snapBoard(b){ return b.E.map(e=>({slot:e.slot, room:e.room, off:!!e.off})); }
function restoreBoard(b, snap){
  b.oc.clear(); b.ot.clear(); b.or.clear();
  snap.forEach((p,i)=>{ const e=b.E[i]; e.slot=p.slot; e.room=p.room; e.off=p.off; });
  b.E.forEach(e=>{ if(!e.off) put(b,e.i,e.slot,e.room); });
}

/* 只看硬性限制，不看有沒有人佔著 */
function hardOk(b,i,slot,room){
  const e=b.E[i], ctx=b.ctx, g=D.grid;
  if(!ctx.roomOk({s:e.s,c:e.c}, room)) return false;
  if(e.len===2 && !ctx.canDbl(slot)) return false;
  const d = ctx.dayOf(slot);
  // 當天已排的節數只要數該日的格子，不必掃整份課表
  let same=0;
  for(let q=0;q<g.periods;q++) if(b.ot.has(e.t+'@'+((d-1)*g.periods+q))) same++;
  if(same + e.len > D.teachers[e.t].cap) return false;
  for(let k=0;k<e.len;k++){ const s=slot+k;
    if(s>=ctx.NS || ctx.dayOf(s)!==d) return false;
    if(ctx.cBlocked[e.c].has(s) || ctx.tBlocked[e.t].has(s) || ctx.sBlocked[e.s].has(s)) return false;
  }
  return true;
}
function blockersAt(b,i,slot,room){
  const e=b.E[i], out=new Set();
  for(let k=0;k<e.len;k++){ const s=slot+k;
    [b.oc.get(e.c+'@'+s), b.ot.get(e.t+'@'+s), b.or.get(room+'@'+s)]
      .forEach(x=>{ if(x!=null && x!==i) out.add(x); });
  }
  return [...out];
}
function roomsFor(b,i){ const e=b.E[i]; return b.ctx.candRooms({s:e.s, c:e.c}); }
function freeSpots(b,i){
  const out=[];
  for(let s=0;s<b.ctx.NS;s++) for(const r of roomsFor(b,i))
    if(hardOk(b,i,s,r) && blockersAt(b,i,s,r).length===0) out.push([s,r]);
  return out;
}
function boardPenalty(b){
  const pos={}; b.E.forEach(e=>{ if(!e.off) pos[e.i]={slot:e.slot, room:e.room}; });
  return penalty(b.ctx, {pos}, b.E, {handoff:false});
}

/* 某一格點下去會怎樣：直接可放／需要連動／完全不能放 */
function slotStatus(b, i, slot){
  let any=false;
  for(const r of roomsFor(b,i)){
    if(!hardOk(b,i,slot,r)) continue;
    any=true;
    if(blockersAt(b,i,slot,r).length===0) return 'ok';
  }
  return any ? 'ripple' : 'no';
}

/* 規劃一次移動，回傳所有要跟著動的課 */
function planMove(idx, target){
  const b = mkBoard();
  const before = snapBoard(b);
  const rooms = roomsFor(b,idx).filter(r=>hardOk(b,idx,target,r));
  if(!rooms.length) return {ok:false, reason:whyNot(b, idx, target)};
  rooms.sort((a,c)=>blockersAt(b,idx,target,a).length - blockersAt(b,idx,target,c).length);

  for(const room of rooms){
    restoreBoard(b, before);
    const blockers = blockersAt(b,idx,target,room);
    const origin = {slot:b.E[idx].slot, room:b.E[idx].room};
    pull(b, idx);
    blockers.forEach(x=>pull(b,x));
    put(b, idx, target, room);

    let done = false;
    // 最單純的情況：跟擋路的那一堂直接對調
    if(blockers.length===1){
      const o = blockers[0];
      if(roomsFor(b,o).includes(origin.room) && hardOk(b,o,origin.slot,origin.room)
         && blockersAt(b,o,origin.slot,origin.room).length===0){
        put(b,o,origin.slot,origin.room); done = true;
      }
    }
    if(!done) done = relocate(b, blockers, 0);

    if(done && b.E.every(e=>!e.off)){
      const moves = [];
      b.E.forEach(e=>{
        const o = before[e.i];
        if(o.slot!==e.slot || o.room!==e.room)
          moves.push({i:e.i, c:e.c, s:e.s, t:e.t, len:e.len,
                      from:{slot:o.slot, room:o.room}, to:{slot:e.slot, room:e.room}});
      });
      if(moves.length<=RIPPLE_MAX_MOVES) return {ok:true, moves, cost:boardPenalty(b), room};
    }
  }
  return {ok:false, reason:'被擠掉的課找不到地方放，請試別的時段'};
}

/* 把被擠掉的課逐一安置；沒有空位就再擠走下一層（深度有限） */
function relocate(b, pending, depth){
  if(!pending.length) return true;
  if(depth > RIPPLE_MAX_DEPTH) return false;
  const head = pending[0], rest = pending.slice(1);

  const spots = freeSpots(b, head).map(([s,r])=>{
    put(b,head,s,r); const c=boardPenalty(b); pull(b,head); return {s,r,c};
  }).sort((a,c)=>a.c-c.c).slice(0, RIPPLE_BRANCH);
  for(const {s,r} of spots){
    put(b,head,s,r);
    if(relocate(b, rest, depth)) return true;
    pull(b,head);
  }

  if(depth < RIPPLE_MAX_DEPTH){
    const cands=[];
    for(let s=0;s<b.ctx.NS;s++) for(const r of roomsFor(b,head)){
      if(!hardOk(b,head,s,r)) continue;
      const bl = blockersAt(b,head,s,r);
      if(bl.length>0 && bl.length<=2) cands.push({s,r,bl});
    }
    for(const {s,r,bl} of cands.slice(0, RIPPLE_BRANCH)){
      const snap = snapBoard(b);
      bl.forEach(x=>pull(b,x));
      put(b,head,s,r);
      if(relocate(b, [...bl, ...rest], depth+1)) return true;
      restoreBoard(b, snap);
    }
  }
  return false;
}

function whyNot(b, idx, target){
  const e=b.E[idx], ctx=b.ctx;
  if(e.len===2 && !ctx.canDbl(target)) return '連堂不能跨午休或跨日';
  for(let k=0;k<e.len;k++){ const s=target+k;
    if(s>=ctx.NS || ctx.dayOf(s)!==ctx.dayOf(target)) return '連堂不能跨日';
    if(ctx.cBlocked[e.c].has(s)) return `${D.classes[e.c].name}這節不上課`;
    if(ctx.tBlocked[e.t].has(s)) return `${D.teachers[e.t].name}這個時段不排課`;
    if(ctx.sBlocked[e.s].has(s)) return `${D.subjects[e.s].name}不排在這一節`;
  }
  return `會讓${D.teachers[e.t].name}超過每天 ${D.teachers[e.t].cap} 節的上限`;
}

/* 天數或節數改變時，slot 的編碼跟著變，必須整份重新換算 */
function changeGrid(nd, np){
  const g=D.grid, op=g.periods;
  if(nd===g.days && np===op) return;
  const dp = s => ({d: Math.floor(s/op)+1, p: s%op+1});
  const enc = (d,pp) => (d-1)*np + (pp-1);
  const keep = (d,pp) => d<=nd && pp<=np;

  D.placements = D.placements.filter(x=>{
    const a=dp(x.slot);
    if(!keep(a.d,a.p)) return false;
    if(x.len===2 && !keep(a.d,a.p+1)) return false;
    x.slot = enc(a.d,a.p); return true;
  });
  Object.values(D.classes).forEach(c=>{
    c.blocked = [...new Set(c.blocked.map(dp).filter(a=>keep(a.d,a.p)).map(a=>enc(a.d,a.p)))];
  });
  D.constraints.forEach(c=>{
    if(c.params.days)    c.params.days    = c.params.days.filter(d=>d<=nd);
    if(c.params.periods) c.params.periods = c.params.periods.filter(x=>x<=np);
    if(c.params.day && c.params.day>nd) c.params.day = nd;
    if(c.params.max && c.params.max>np) c.params.max = np;
  });
  g.days=nd; g.periods=np;
  g.morning = g.morning.filter(x=>x<=np);
  g.breaks  = g.breaks.filter(x=>x<np);
  Object.values(D.teachers).forEach(t=>{ if(t.cap>np) t.cap=np; });
  snapshotP2(); TS=null; saveAll(); refreshStats();
}

      h.appendChild(del); card.appendChild(h);

}

        <div class="kv"><span>每週可容納</span><b>${same*D.grid.days*D.grid.periods} 節</b></div>
        <div class="kv"><span>目前需求</span><b>${need[r.type]||0} 節</b></div>`;
      b.appendChild(info);
      if((need[r.type]||0) > same*D.grid.days*D.grid.periods){
        const n=el('div','note bad'); n.style.marginTop='12px';
        n.textContent='需求超過容量，一定排不出來。請增加教室或減少節數。';
        b.appendChild(n);
      }
      card.appendChild(b); return card;
    },
  });
}

/* ---------- 科目 ---------- */
function subjectPane(){
  const ids = Object.keys(D.subjects);
  if(sSel==null || !D.subjects[sSel]) sSel = ids[0] || null;
  const used = id => D.requirements.filter(r=>r.s===id).reduce((n,r)=>n+r.n,0);
  return listPane({
    title:'科目', items: ids.map(id=>({id, ...D.subjects[id]})), selId:sSel,
    onSel:id=>{ sSel=id; renderSetup(); },
    onAdd:()=>{ let n=1; while(D.subjects['SB'+n]) n++;
      D.subjects['SB'+n]={name:'新科目 '+n, room:null, core:false}; sSel='SB'+n; saveAll(); renderSetup(); },
    rowHTML:s=>`<span class="t-name">${s.name}</span>
      ${s.core?'<span class="chip">主科</span>':''}
      ${s.room?`<span class="chip special">${roomTypeName(s.room)}</span>`:''}
      <span class="mono t-num">${used(s.id)}</span>`,
    editor:()=>{
      const card=el('div','card');
      if(!sSel){ card.appendChild(el('div','card-b','請先新增一個科目。')); return card; }
      const sj=D.subjects[sSel];
      const h=el('div','card-h',`<h3>${sj.name}</h3>`);
      const del=el('button','btn','刪除這個科目');
      del.onclick=()=>{
        if(used(sSel) && !confirm(`有 ${used(sSel)} 節課是這一科，刪除會一併移除。確定？`)) return;
        D.requirements = D.requirements.filter(r=>r.s!==sSel);
        D.placements = D.placements.filter(x=>x.s!==sSel);
        delete D.subjects[sSel]; sSel=null; snapshotP2(); saveAll(); refreshStats(); renderSetup();
      };
      h.appendChild(del); card.appendChild(h);
      const b=el('div','card-b'); const gr=el('div','form-grid');
      const fld=(l,n,hint)=>{ const w=el('div','fld'); w.appendChild(el('label','eyebrow',l));
        w.appendChild(n); if(hint) w.appendChild(el('div','hint',hint)); return w; };
      const nm=el('input'); nm.className='in'; nm.value=sj.name;
      nm.oninput=()=>{ sj.name=nm.value; saveAll(); h.querySelector('h3').textContent=sj.name; };
      gr.appendChild(fld('科目名稱', nm));
      const rt=el('select');
      const o0=el('option',null,'在原班教室上'); o0.value='';
      if(!sj.room) o0.selected=true; rt.appendChild(o0);
      ROOM_TYPES.filter(x=>x[0]!=='homeroom').forEach(([k,t])=>{
        const o=el('option',null,t); o.value=k; if(k===sj.room)o.selected=true; rt.appendChild(o); });
      rt.onchange=()=>{
        sj.room = rt.value || null;
        D.placements = D.placements.filter(x=>x.s!==sSel);   // 教室型態變了，原本的位置不再合法
        snapshotP2(); saveAll(); refreshStats(); renderSetup();
      };
      gr.appendChild(fld('需要的教室', rt, '改動會清掉這一科已排定的位置，需重新排課'));
      const core=el('div','seg');
      [['是','1'],['否','0']].forEach(([lbl,v])=>{
        const bt=el('button',null,lbl); bt.type='button';
        bt.setAttribute('aria-pressed', String(!!sj.core)===String(v==='1'));
        bt.onclick=()=>{ sj.core=(v==='1'); saveAll(); renderSetup(); }; core.appendChild(bt); });
      gr.appendChild(fld('是否為主科', core, '主科會套用「盡量排上午」的偏好'));
      b.appendChild(gr);
      card.appendChild(b); return card;
    },
  });
}

/* ---------- 資料：備份、還原、匯出 ---------- */
function dataPane(){
  const card = el('div','card');
  card.appendChild(el('div','card-h','<h3>資料</h3>'));
  const b = el('div','card-b');

  const size = (()=>{ try{ return (localStorage.getItem(STORE)||'').length; }catch(e){ return 0; } })();
  b.appendChild(el('div','note '+(size?'ok':'warn'),
    size ? `所有設定與課表都存在<b>這台瀏覽器</b>裡（目前 ${(size/1024).toFixed(0)} KB）。`
         + '換一台電腦或清除瀏覽器資料就會不見 —— 重要的話請下載備份。'
         : '目前還沒有存檔，改動任何設定後就會自動存下來。'));

  const mk=(title, hint, btns)=>{
    const box=el('div'); box.style.marginTop='20px';
    box.appendChild(el('div','eyebrow',title));
    box.appendChild(el('div','hint',hint));
    const row=el('div'); row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-top:9px';
    btns.forEach(x=>row.appendChild(x)); box.appendChild(row); return box;
  };

  const dl=el('button','btn','下載備份'); dl.onclick=()=>downloadText(schoolJSON(),'school.json','application/json');
  const cp=el('button','btn','複製 JSON');
  cp.onclick=()=>copyText(schoolJSON(), cp, '複製 JSON');
  b.appendChild(mk('備份整份資料',
    '包含節次、班級、教室、科目、老師、配課、需求與目前的課表。也可以餵給 prototype/ 的 Python 求解器。',
    [dl, cp]));

  const file=el('input'); file.type='file'; file.accept='.json'; file.style.display='none';
  file.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const j=JSON.parse(rd.result);
        const miss=['grid','classes','rooms','subjects','teachers','requirements'].filter(k=>!j[k]);
        if(miss.length) throw new Error('缺少 '+miss.join('、'));
        j.placements = j.placements || [];
        j.constraints = j.constraints || [];
        localStorage.setItem(STORE, JSON.stringify(j));
        location.reload();
      }catch(err){ alert('讀不進來：'+err.message); }
    };
    rd.readAsText(f,'utf-8');
  };
  const imp=el('button','btn','選擇備份檔'); imp.onclick=()=>file.click();
  b.appendChild(mk('還原備份', '會覆蓋目前所有資料。', [imp, file]));

  const rst=el('button','btn','回復成範例資料');
  rst.onclick=()=>{ if(confirm('會清掉這台裝置上的所有設定與課表，確定？')) resetAll(); };
  b.appendChild(mk('重來', '清除這台瀏覽器的存檔，回到內建的 12 班範例。', [rst]));

  card.appendChild(b); return card;
}

function schoolJSON(){
  return JSON.stringify({
    grid:D.grid, classes:D.classes, rooms:D.rooms, subjects:D.subjects,
    teachers:D.teachers, requirements:D.requirements,
    constraints:D.constraints, placements:D.placements,
  }, null, 2);
}
function downloadText(text, name, mime){
  const a=el('a'); a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },0);
}
async function copyText(text, btn, label){
  try{ await navigator.clipboard.writeText(text);
    btn.textContent='已複製 ✓'; setTimeout(()=>{ btn.textContent=label; },1800);
  }catch(e){
    const ta=el('textarea'); ta.className='in'; ta.rows=10; ta.value=text; ta.readOnly=true;
    ta.style.marginTop='10px'; btn.parentElement.parentElement.appendChild(ta); ta.select();
  }
}

/* ---------- 課表匯出 ---------- */
function timetableCSV(){
  const g=D.grid, rows=[['班級','節次',...DAYS.slice(0,g.days).map(d=>'週'+d)]];
  Object.entries(D.classes).forEach(([cid,cls])=>{
    const cell={};
    D.placements.filter(x=>x.c===cid).forEach(x=>{
      for(let k=0;k<x.len;k++) cell[x.slot+k] =
        D.subjects[x.s].name + '（' + (D.teachers[x.t]?D.teachers[x.t].name:'?') + '）';
    });
    for(let q=1;q<=g.periods;q++){
      const line=[cls.name, '第'+q+'節'];
      for(let d=1;d<=g.days;d++){
        const s=(d-1)*g.periods+(q-1);
        line.push(cls.blocked.includes(s) ? '' : (cell[s]||''));
      }
      rows.push(line);
    }
  });
  return '﻿' + rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\r\n');
}

/* 列印用：把所有班級課表畫進隱藏容器，交給瀏覽器的列印功能。
   不開新視窗，因為嵌入式檢視器會擋彈出視窗。 */
function buildPrintArea(){
  const host = document.getElementById('print-area');
  host.innerHTML = '';
  const g = D.grid;
  Object.entries(D.classes).forEach(([cid,cls])=>{
    const sec = el('section','pr-page');
    sec.appendChild(el('h2','pr-t', cls.name + ' 課表'));
    const cell={};
    D.placements.filter(x=>x.c===cid).forEach(x=>{
      for(let k=0;k<x.len;k++) cell[x.slot+k]=x;
    });
    const t=el('table','pr-tt');
    t.innerHTML = '<thead><tr><th></th>'
      + DAYS.slice(0,g.days).map(d=>`<th>週${d}</th>`).join('') + '</tr></thead>';
    const tb=el('tbody');
    for(let q=1;q<=g.periods;q++){
      const tr=el('tr'); let h=`<th>第${q}節</th>`;
      for(let d=1;d<=g.days;d++){
        const s=(d-1)*g.periods+(q-1), x=cell[s];
        h += cls.blocked.includes(s) ? '<td class="pr-x"></td>'
          : x ? `<td><b>${D.subjects[x.s].name}</b><span>${D.teachers[x.t]?D.teachers[x.t].name:''}</span></td>`
              : '<td></td>';
      }
      tr.innerHTML=h; tb.appendChild(tr);
    }
    t.appendChild(tb); sec.appendChild(t); host.appendChild(sec);
  });
}

  ['p-setup','基本設定', renderSetup],
  ['p-teachers','老師設定', renderTeachers],
  ['p-load','配課', renderAssign],
  ['p-phase1','科任／行政排課', renderPhase1],
  ['p-handoff','交接檢查', renderHandoff],
  ['p-phase2','導師自排', renderPhase2],
  ['p-view','課表檢視與調整', renderView],
];
const nav = document.getElementById('steps');
STEPS.forEach(([id,label],i)=>{
  const b = el('button','step');
  b.innerHTML = `<span class="n">${i+1}</span><span>${label}</span>`;
  b.setAttribute('role','tab'); b.setAttribute('aria-selected', i===0);
  b.setAttribute('aria-controls', id);
  b.onclick = ()=>go(i);
  nav.appendChild(b);
});
function go(i){
  STEPS.forEach(([id],k)=>{
    document.getElementById(id).hidden = k!==i;
    nav.children[k].setAttribute('aria-selected', k===i);
  });
  STEPS[i][2]();
  window.scrollTo({top:0, behavior:'instant'});
}

(function(){
  var root = document.documentElement, btn = document.getElementById('theme');
  var saved = null;
  try{ saved = localStorage.getItem('theme'); }catch(e){}
  if(saved) root.setAttribute('data-theme', saved);
  btn.addEventListener('click', function(){
    // 沒選過就以目前實際呈現的顏色為準，切到相反的那一邊
    var cur = root.getAttribute('data-theme');
    if(!cur) cur = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
  });
})();
